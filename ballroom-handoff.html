<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
const gltfLoader = new GLTFLoader();
// Draco decoder: most GLBs in this repo are Draco-compressed (white_lambo, weapons, ballroom props, cats).
// Without this, GLTFLoader throws 'No DRACOLoader instance provided' and the model silently fails to load.
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
gltfLoader.setDRACOLoader(dracoLoader);
// GLB prop helper: fit a loaded model to target W/H/D (non-uniform, so it
// matches the footprint it replaces), centre it in a group, and return the
// group. The caller places the group: base-anchored props sit at y = targetH/2
// (so the model base is on the floor), centre-anchored props at the centre.
// If a GLB fails to load, the caller keeps its procedural mesh — nothing
// disappears, the room just keeps its old look.
function fitPropGroup(obj, targetW, targetH, targetD){
  obj.traverse((o)=>{ if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  let bb = new THREE.Box3().setFromObject(obj); const size = new THREE.Vector3(); bb.getSize(size);
  if (!size.x || !size.y || !size.z) return null;
  obj.scale.set(targetW / size.x, targetH / size.y, targetD / size.z);
  bb = new THREE.Box3().setFromObject(obj); const c = new THREE.Vector3(); bb.getCenter(c);
  obj.position.set(-c.x, -c.y, -c.z);
  const g = new THREE.Group(); g.add(obj); return g;
}
function loadProp(path, x, y, z, targetW, targetH, targetD, rotY, hide){
  gltfLoader.load(path, (gltf)=>{
    const g = fitPropGroup(gltf.scene, targetW, targetH, targetD); if (!g) return;
    g.position.set(x, y, z); if (rotY) g.rotation.y = rotY; scene.add(g);
    (hide || []).forEach((m)=>{ if (m) m.visible = false; });
  }, undefined, ()=>{ /* keep procedural fallback */ });
}

const HALL_X = 20, HALL_Z = 14;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x201409);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
scene.add(new THREE.AmbientLight(0xffe6b0, 0.85));
scene.add(new THREE.HemisphereLight(0xffe6b0, 0x3a2410, 0.6));
// Ballroom textures (user uploads, assets/textures/): flat colour stays
// until the texture arrives, and stays forever if it fails to load.
const texLoader = new THREE.TextureLoader();
function applyTex(mesh, path, rx, ry){
  texLoader.load(path, (tex)=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(rx, ry); tex.colorSpace = THREE.SRGBColorSpace;
    mesh.material.map = tex; mesh.material.color.setHex(0xffffff); mesh.material.needsUpdate = true;
  }, undefined, ()=>{});
}
function applyTexHalf(mesh, path, offsetX){
  texLoader.load(path, (tex)=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(0.5, 1); tex.offset.set(offsetX, 0); tex.colorSpace = THREE.SRGBColorSpace;
    mesh.material.map = tex; mesh.material.color.setHex(0xffffff); mesh.material.needsUpdate = true;
  }, undefined, ()=>{});
}
function applyTexToGroup(group, path){
  texLoader.load(path, (tex)=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(1, 1); tex.colorSpace = THREE.SRGBColorSpace;
    group.traverse((o)=>{ if (o.isMesh){ o.material.map = tex; o.material.color.setHex(0xffffff); o.material.needsUpdate = true; } });
  }, undefined, ()=>{});
}
function flatPlane(x, y, z, w, d, color, path, rx, ry, rotX){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color }));
  m.rotation.x = rotX === undefined ? -Math.PI / 2 : rotX; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m);
  if (path) applyTex(m, path, rx, ry); return m;
}

// ---- Ballroom ----
function box(x, y, z, w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color }));
  m.position.set(x, y, z); scene.add(m); return m;
}
function cyl(x, y, z, rTop, rBot, h, color) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 24), new THREE.MeshStandardMaterial({ color }));
  m.position.set(x, y, z); scene.add(m); return m;
}
// Floor + dance floor + walls, with the new ballroom textures.
const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALL_X * 2, HALL_Z * 2), new THREE.MeshStandardMaterial({ color: 0x6b4a26 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
applyTex(floor, 'assets/textures/ballroom/ballroom_floor_polished_wood_honey_brown_1024.webp', 8, 6);
const dance = new THREE.Mesh(new THREE.PlaneGeometry(13, 9), new THREE.MeshStandardMaterial({ color: 0x8a5a2e }));
dance.rotation.x = -Math.PI / 2; dance.position.set(0, 0.02, -1); scene.add(dance);
applyTex(dance, 'assets/textures/ballroom/ballroom_floor_herringbone_marble_border_1024.webp', 1, 1);
const walls = [
  box(0, 3, -HALL_Z - 0.5, HALL_X * 2 + 2, 6, 1, 0x5a2f22), // north wall
  box(-11.25, 3, HALL_Z + 0.5, 19.5, 6, 1, 0x5a2f22), // south wall, left of doors
  box(11.25, 3, HALL_Z + 0.5, 19.5, 6, 1, 0x5a2f22), // south wall, right of doors
  box(0, 4.5, HALL_Z + 0.5, 3, 3, 1, 0x5a2f22), // lintel above double doors
  box(-HALL_X - 0.5, 3, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22),
  box(HALL_X + 0.5, 3, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22),
];
walls.forEach((w)=>applyTex(w, 'assets/textures/ballroom/ballroom_wall_damask_burgundy_gold_1024.webp', 8, 2));
// Second story (2026-11-06): taller wall band above the existing walls, so the
// balcony at y=6 has headroom. Same damask, same footprint as below.
const upperWalls = [
  box(0, 9, -HALL_Z - 0.5, HALL_X * 2 + 2, 6, 1, 0x5a2f22), // north wall, upper
  box(-11.25, 9, HALL_Z + 0.5, 19.5, 6, 1, 0x5a2f22), // south wall, upper left
  box(11.25, 9, HALL_Z + 0.5, 19.5, 6, 1, 0x5a2f22), // south wall, upper right
  box(0, 9, HALL_Z + 0.5, 3, 6, 1, 0x5a2f22), // upper lintel above the double doors
  box(-HALL_X - 0.5, 9, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22),
  box(HALL_X + 0.5, 9, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22),
];
upperWalls.forEach((w)=>applyTex(w, 'assets/textures/ballroom/ballroom_wall_damask_burgundy_gold_1024.webp', 8, 2));
// Wood wainscoting strip along the lower walls (player clamp is ±19/±13,
// the strips sit at ±19.82/±13.82, so they are never walked into).
[[-11.25, -13.82, 19.5, 0.2], [11.25, -13.82, 19.5, 0.2], [-11.25, 13.82, 19.5, 0.2], [11.25, 13.82, 19.5, 0.2], [-19.82, 0, 0.2, 28], [19.82, 0, 0.2, 28]].forEach(([x, z, w, d])=>{
  const m = box(x, 0.6, z, w, 1.2, d, 0x3a2410); applyTex(m, 'assets/textures/ballroom/ballroom_wall_wood_wainscoting_dark_1024.webp', 8, 1);
});
// Ceiling (was open) with plaster/moulding, plus curtains on the north wall.
flatPlane(0, 11.95, 0, HALL_X * 2, HALL_Z * 2, 0xe8ddc8, 'assets/textures/ballroom/ballroom_ceiling_plaster_moulding_1024.webp', 6, 4, Math.PI / 2); // raised to ~12 m for the second story (2026-11-06)
[-12, -4, 4, 12].forEach((x)=>{
  const c = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 3.5), new THREE.MeshStandardMaterial({ color: 0x5a1a2a }));
  c.position.set(x, 2.75, -13.65); scene.add(c); applyTex(c, 'assets/textures/ballroom/ballroom_curtain_velvet_1024.webp', 1, 1);
});
// Carpet runner (entrance to dance floor) and a rug in front of the bar.
flatPlane(0, 0.03, 7.5, 2.5, 11, 0x7a1a1a, 'assets/textures/ballroom/ballroom_carpet_runner_red_gold_border_1024.webp', 1, 4);
flatPlane(14, 0.04, 6, 6, 4, 0x5a2a3a, 'assets/textures/ballroom/ballroom_rug_medallion_large_1024.webp', 1, 1);
// Spiral staircase + second-story balcony, NE corner (2026-11-06, walkable).
// Helix: 15 steps, one full turn, 0.4 m rise per step, floor (y=0) to balcony
// (y=6). Entry/exit is on the west side (180 deg), facing the room, so the
// top step lands straight onto the balcony. Treads span r 0.55-1.75 (about
// 1.2 m deep), centre column r 0.55. No hint text.
const STAIR_C = { x: 17, z: -11 }; // helix centre, NE corner
const STAIR_TOP = 6; // balcony level
const STAIR_R_OUT = 1.75; // outer edge of the treads
const BALC = { x0: 5, x1: 17, z0: -14, z1: -10.5 }; // balcony floor rectangle
cyl(STAIR_C.x, 3.2, STAIR_C.z, 0.55, 0.55, 6.4, 0x3a2a18); // centre column
for (let i = 0; i < 15; i++) {
  const th = (180 + i * 24) * Math.PI / 180;
  const st = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.18, 1.0), new THREE.MeshStandardMaterial({ color: 0x6b4a26 }));
  st.position.set(STAIR_C.x + 1.15 * Math.cos(th), i * 0.4 - 0.09, STAIR_C.z + 1.15 * Math.sin(th));
  st.rotation.y = -th; scene.add(st);
  applyTex(st, 'assets/textures/ballroom/ballroom_floor_polished_wood_honey_brown_1024.webp', 1, 1);
}
// Balcony floor at y=6: two boxes (west floor + north strip) leaving the
// stairwell open where the top steps arrive, so the climber's head never
// passes through the floor. North edge inset 0.1 from the wall (no coplanar face).
const balcW = box(10, 5.9, -12.2, 10, 0.2, 3.4, 0x6b4a26); // x 5-15, z -13.9..-10.5
applyTex(balcW, 'assets/textures/ballroom/ballroom_floor_polished_wood_honey_brown_1024.webp', 3, 1);
const balcN = box(16, 5.9, -13.2, 2, 0.2, 1.4, 0x6b4a26); // x 15-17, z -13.9..-12.5
applyTex(balcN, 'assets/textures/ballroom/ballroom_floor_polished_wood_honey_brown_1024.webp', 1, 1);
// Balcony railings (dark wood): top rails + posts on the south edge, the west
// edge, and the north strip's east edge. The stair arrival (x 15.5-16.5 on the
// south edge) stays open — that is how he steps on and off the stairs. The
// centre column guards the east side of the stairwell.
box(10.25, 7.0, -10.5, 10.5, 0.08, 0.08, 0x3a2a18); // south rail, x 5-15.5
box(16.75, 7.0, -10.5, 0.5, 0.08, 0.08, 0x3a2a18); // south rail stub, x 16.5-17
box(5, 7.0, -12.25, 0.08, 0.08, 3.5, 0x3a2a18); // west rail, z -14..-10.5
box(17, 7.0, -13.2, 0.08, 0.08, 1.4, 0x3a2a18); // north strip east rail, z -13.9..-12.5
for (let x = 5.75; x <= 14.75; x += 1.5) box(x, 6.5, -10.5, 0.08, 1, 0.08, 0x3a2a18);
box(17, 6.5, -10.5, 0.08, 1, 0.08, 0x3a2a18);
for (let z = -13.25; z <= -11.75; z += 1.5) box(5, 6.5, z, 0.08, 1, 0.08, 0x3a2a18);
box(17, 6.5, -13.5, 0.08, 1, 0.08, 0x3a2a18); box(17, 6.5, -12.75, 0.08, 1, 0.08, 0x3a2a18);
// Exit door (north) + entrance (south): one single double-door texture.
const exitDoor = box(0, 1.5, -HALL_Z + 0.1, 3, 3, 0.3, 0x2e7d32);
applyTex(exitDoor, 'assets/textures/ballroom/ballroom_door_double_mahogany_1024.webp', 1, 1);
// Double doors are built in the exterior block below (auto-open on approach).
// Chandeliers: 6 now (3 north + 3 south, so the entrance side is no longer
// dark), brighter — point lights 30 -> 80, distance 22 -> 30. Real
// chandelier GLBs replace the spheres when loaded; lights stay.
const CHANDELIERS = [[-10, -4], [0, -1], [10, -4], [-10, 8], [0, 10], [10, 8]];
const chandelierProc = [];
CHANDELIERS.forEach(([x, z]) => {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffd97a, emissive: 0xffc94d, emissiveIntensity: 1.2 }));
  s.position.set(x, 5.2, z); scene.add(s); chandelierProc.push(s);
  const l = new THREE.PointLight(0xffc94d, 80, 30); l.position.set(x, 4.8, z); scene.add(l);
});
gltfLoader.load('assets/props/ballroom_chandelier.glb', (gltf)=>{
  CHANDELIERS.forEach(([x, z])=>{
    const g = fitPropGroup(gltf.scene.clone(), 1.1, 1.4, 1.1); if (!g) return;
    g.position.set(x, 5.2, z); scene.add(g); applyTexToGroup(g, 'assets/textures/ballroom/ballroom_chandelier_crystal_glass_1024.webp');
  });
  chandelierProc.forEach((m)=>{ m.visible = false; });
}, undefined, ()=>{});
// Bar (east wall) — real bar + bar top GLBs replace the boxes when loaded.
const barProc = [box(17.5, 0.6, 6, 4, 1.2, 1.5, 0x4a2c14), box(17.5, 1.4, 6, 4, 0.15, 1.8, 0x7a4a22)];
loadProp('assets/props/ballroom_bar.glb', 17.5, 0.55, 6, 4, 1.1, 0.7, 0, [barProc[0]]);
loadProp('assets/props/ballroom_bar_top.glb', 17.5, 1.15, 6, 4, 0.1, 0.9, 0, [barProc[1]]);
// Bar counter texture as a thin top surface over the GLB bar top. If the
// GLB fails, this plane sits inside the procedural bar top box and is hidden.
flatPlane(17.5, 1.21, 6, 4, 0.9, 0x6a4a2a, 'assets/textures/ballroom/ballroom_bar_counter_wood_marble_1024.webp', 1, 1);
// Round tables + chairs (colliders)
// Real table/chair GLBs replace the procedural ones when loaded; colliders
// are unchanged, so movement and talk radii do not change. Chairs move in
// from 2.1 m (for the old 3 m tables) to 1.2 m (for the 1.8 m GLB tables).
const tables = [[-13, 8], [-13, -9], [13, 9], [-6, 10], [7, -10], [14, -8]];
const colliders = []; // {x,z,r}
const tableProc = [], chairProc = [];
tables.forEach(([x, z]) => {
  tableProc.push(cyl(x, 0.45, z, 1.5, 1.5, 0.12, 0xf5ead0));
  tableProc.push(cyl(x, 0.2, z, 0.15, 0.25, 0.4, 0x3a2a18));
  colliders.push({ x, z, r: 1.9, y: 0 }); // ground floor only — the balcony player at y=6 walks over the tables
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + 0.4;
    chairProc.push(box(x + Math.cos(a) * 2.1, 0.45, z + Math.sin(a) * 2.1, 0.5, 0.9, 0.5, 0x5a2f22));
  }
});
gltfLoader.load('assets/props/ballroom_table.glb', (gltf)=>{
  tables.forEach(([x, z])=>{
    const g = fitPropGroup(gltf.scene.clone(), 1.8, 0.75, 1.8); if (!g) return;
    g.position.set(x, 0.375, z); scene.add(g);
    // Linen tablecloth disc on top of the GLB table (top is at 0.75 m).
    const cloth = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.02, 24), new THREE.MeshStandardMaterial({ color: 0xf5ead0 }));
    cloth.position.set(x, 0.78, z); scene.add(cloth); applyTex(cloth, 'assets/textures/ballroom/ballroom_tablecloth_linen_cream_1024.webp', 1, 1);
  });
  tableProc.forEach((m)=>{ m.visible = false; });
}, undefined, ()=>{});
gltfLoader.load('assets/props/ballroom_chair.glb', (gltf)=>{
  tables.forEach(([x, z])=>{
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + 0.4;
      const cx = x + Math.cos(a) * 1.2, cz = z + Math.sin(a) * 1.2;
      const g = fitPropGroup(gltf.scene.clone(), 0.57, 1.0, 0.6); if (!g) continue;
      g.position.set(cx, 0.5, cz); g.rotation.y = Math.atan2(x - cx, z - cz); scene.add(g);
      applyTexToGroup(g, 'assets/textures/ballroom/ballroom_chair_upholstery_velvet_brocade_1024.webp');
    }
  });
  chairProc.forEach((m)=>{ m.visible = false; });
}, undefined, ()=>{});
colliders.push({ x: 17.5, z: 6, r: 2.6, y: 0 }); // bar, ground floor only
// Staircase + balcony colliders (2026-11-06): centre column blocks at every height;
// balcony railings (yMin) only block up on the balcony, never the climber below.
colliders.push({ x: STAIR_C.x, z: STAIR_C.z, r: 0.7 });
[5.75, 7.25, 8.75, 10.25, 11.75, 13.25, 14.75, 17].forEach((x)=>colliders.push({ x, z: -10.5, r: 0.8, yMin: 5.5 })); // south railing (gap x 15.5-16.5 is the stair arrival)
[[-13.25], [-11.75]].forEach(([z])=>colliders.push({ x: 5, z, r: 0.8, yMin: 5.5 })); // west railing
[[-13.5], [-12.75]].forEach(([z])=>colliders.push({ x: 17, z, r: 0.8, yMin: 5.5 })); // north strip east railing
// ---- Exterior: mansion drive, round drive, bushes, steps, double doors (2026-11-04) ----
// Kyle's mission starts outside. Ground is 1.5 m below the ballroom floor,
// so a 6-step flight climbs from the drive to the double doors.
// Bushes and mansion wings are procedural geometry (no bush/car model was
// supplied for these); the white Lamborghini is the real repo GLB.
flatPlane(0, -1.5, 42, 80, 70, 0x2e5a2e, 'assets/textures/exterior/exterior_lawn_grass_clover_1024.webp', 8, 7); // lawn, extended south past the new road
const driveMesh = cyl(0, -1.48, 32, 13, 13, 0.1, 0x333333); // round drive
applyTex(driveMesh, 'assets/textures/exterior/exterior_drive_asphalt_1024.webp', 4, 4);
const islandMesh = cyl(0, -1.47, 32, 5, 5, 0.2, 0x2e5a2e); // drive island
applyTex(islandMesh, 'assets/textures/exterior/exterior_lawn_grass_clover_1024.webp', 2, 2);
// Fountain in the round-drive island (2026-11-06): simple stone basin + still
// water + center column with a top tier. Procedural geometry (no fountain GLB

      if (photos.length === 3 && !won) { won = true; stopWaltz(); document.getElementById('winText').textContent = 'You photographed all 3 cat collars — moon, note, rose, in that order — while the guests looked away, and slipped out the north door. Still just the photographer.'; document.getElementById('win').style.display = 'flex'; }
    }

}

// Spiral staircase height (2026-11-06): the helix winds once (360 deg) from the
// floor to the balcony (y=6). The angle is tracked continuously while on the
// stairs, so the entry/exit seam (west side, 180 deg) never jumps.
let stairOn = false, stairPhi = 180, stairPrevTheta = 0;
function stairAngleDeg(x, z) { return (Math.atan2(z - STAIR_C.z, x - STAIR_C.x) * 180 / Math.PI + 360) % 360; }

function stairBalconyY(pos) {
  const dx = pos.x - STAIR_C.x, dz = pos.z - STAIR_C.z;
  const r = Math.hypot(dx, dz);

  const inAnnulus = r > 0.55 && r < 2.0;
  const nearEntry = Math.abs(wrap180(theta - 180)) < 60;
  // Top engagement only right at the top step, so walking the balcony past the
  // stairwell does not snag the player onto the helix.
  const nearTopStep = Math.hypot(pos.x - (STAIR_C.x - 1.15), pos.z - STAIR_C.z) < 0.9;
  if (!stairOn && inAnnulus && nearEntry && (pos.y < 0.5 || (pos.y > 5.5 && nearTopStep))) {

    // under his feet instead of snapping to a landing.
    stairPhi = (pos.y > 3 ? 540 : 180) + wrap180(theta - 180);
    stairPrevTheta = theta;
  }
  if (stairOn) {

    stairPhi += wrap180(theta - stairPrevTheta); stairPrevTheta = theta;
    const prog = Math.max(0, Math.min(360, stairPhi - 180));
    // Step off at a landing: leave the stair when he walks away from it.
    if (!inAnnulus) { stairOn = false; }
    else if (prog <= 0 && !nearEntry) { stairOn = false; } // walked around the base
    else if (prog >= 360 && !nearEntry) { stairOn = false; } // walked around the top onto the balcony
    else {
      // Mid-flight: stay on the treads.
      if (prog > 0 && prog < 360 && r > 0.01) {
        const rr = Math.max(0.7, Math.min(1.65, r));
        pos.x = STAIR_C.x + dx / r * rr; pos.z = STAIR_C.z + dz / r * rr;
      }
      return prog >= 360 ? STAIR_TOP : (prog <= 0 ? 0 : STAIR_TOP * prog / 360);
    }
    // Disengaged above: fall through to the balcony / ground check.
  }
  if (!stairOn && inAnnulus && pos.y < 0.5 && !nearEntry) {
    // Under the stair where the low steps are: the footprint is solid here.
    pos.x = STAIR_C.x + dx / r * 2.0; pos.z = STAIR_C.z + dz / r * 2.0;
  }

  if (pos.y >= 5 && pos.x >= BALC.x0 && pos.x <= BALC.x1 && pos.z >= BALC.z0 && pos.z <= BALC.z1) return STAIR_TOP;
  return 0;
}

// ---- Loop ----
const clock = new THREE.Clock();
function animate() {

      player.position.z = Math.max(13.5, Math.min(45, player.position.z));

      n.mixer.update(dt);

      else if (n.role === 'donald' && n.falling > 0) playMxCharClipOnce(n, 'falling');
      else if (n.role === 'donald' && n.moving) playMxCharClip(n, 'drunkStumble');
      else if (n.role === 'donald') playMxCharClip(n, 'drunkIdle');

      else if (windowOpen) { kyleIdleTimer = 4 + Math.random() * 2; playMxCharClip(kyleNPCChar, 'idle'); }

        kyleIdleTimer -= dt;
        if (kyleIdleTimer <= 0) {

          if (mxClips[k]) { playMxCharClipOnce(kyleNPCChar, k); kyleIdleVarKey = k; kyleIdleVarEnd = t + mxClips[k].duration; }

        } else playMxCharClip(kyleNPCChar, 'idle');
      }
    }
    // Auto rendezvous 2026-11-04: walking up to Rochelle starts it, no tap needed.
    if (missionStage === 'handoff' && started && !handoffCine && rochelleNPC && rochelleNPC.group.position.distanceTo(player.position) < 3.2) startHandoff();
    // Prompt / exit proximity
    let best = null, bd = 3.2;
    for (const n of NPCS) { if (!n.group.visible) continue; const d = n.group.position.distanceTo(player.position); if (d < bd) { bd = d; best = n; } }
    const prompt = document.getElementById('prompt');
    // The prompt element was removed with the HUD text, so prompt is null:

      if (prompt) { prompt.textContent = photos.length === 3 ? 'North exit open — tap USE to leave' : 'North exit is locked — photograph all 3 collars first (moon, note, rose)'; prompt.style.display = 'block'; }
    } else { if (prompt) prompt.style.display = 'none'; if (talking) endTalk(); }

    for (const n of NPCS) {
      if (n === talking) continue;
      if (n.role === 'cat' && (n.name === 'Moxie' || n.name === 'Mabel') && playFight.active && !n.fleeing && !n.fed) continue;
      if (windowOpen && n.role !== 'cat') {

        // Donald. Nobody is watching Rochelle or the cat.
        n.group.rotation.y = Math.atan2(n.group.position.x - player.position.x, n.group.position.z - player.position.z);
        n.moving = false; continue;
      }

      // dialogue line shows. The other character keeps the Rumba.

    else if (handoffPhase === 'donald') k = ph < 0.25 ? ease(ph / 0.25) : 1; // pan to the doorway, hold on Donald

    const ease = (x) => x * x * (3 - 2 * x);

    else if (ph < 0.68) k = 1; // hold on the event

}
