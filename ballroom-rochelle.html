<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<body>

<div id="overlay"><h1>Rochelle's Photo Mission</h1><p>Photographer first, agent second. Kyle is on your earpiece.</p><button id="startBtn">Enter as Rochelle</button><p><a href="ballroom.html">Back to the Kyle-player ballroom</a></p></div>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const gltfLoader = new GLTFLoader();
// GLB prop helper: fit a loaded model to target W/H/D (non-uniform, so it
// matches the footprint it replaces), centre it in a group, and return the
// group. The caller places the group: base-anchored props sit at y = targetH/2
// (so the model base is on the floor), centre-anchored props at the centre.
// If a GLB fails to load, the caller keeps its procedural mesh — nothing
// disappears, the room just keeps its old look.
function fitPropGroup(obj, targetW, targetH, targetD){
  obj.traverse((o)=>{ if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  let bb = new THREE.Box3().setFromObject(obj); const size = new THREE.Vector3(); bb.getSize(size);
  if (!size.x || !size.y || !size.z) return null;
  obj.scale.set(targetW / size.x, targetH / size.y, targetD / size.z);
  bb = new THREE.Box3().setFromObject(obj); const c = new THREE.Vector3(); bb.getCenter(c);
  obj.position.set(-c.x, -c.y, -c.z);
  const g = new THREE.Group(); g.add(obj); return g;
}
function loadProp(path, x, y, z, targetW, targetH, targetD, rotY, hide){
  gltfLoader.load(path, (gltf)=>{
    const g = fitPropGroup(gltf.scene, targetW, targetH, targetD); if (!g) return;
    g.position.set(x, y, z); if (rotY) g.rotation.y = rotY; scene.add(g);
    (hide || []).forEach((m)=>{ if (m) m.visible = false; });
  }, undefined, ()=>{ /* keep procedural fallback */ });
}

const HALL_X = 20, HALL_Z = 14;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x201409);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
scene.add(new THREE.AmbientLight(0xffe6b0, 0.85));
scene.add(new THREE.HemisphereLight(0xffe6b0, 0x3a2410, 0.6));
// Ballroom textures (user uploads, assets/textures/): flat colour stays
// until the texture arrives, and stays forever if it fails to load.
const texLoader = new THREE.TextureLoader();
function applyTex(mesh, path, rx, ry){
  texLoader.load(path, (tex)=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(rx, ry); tex.colorSpace = THREE.SRGBColorSpace;
    mesh.material.map = tex; mesh.material.color.setHex(0xffffff); mesh.material.needsUpdate = true;
  }, undefined, ()=>{});
}
function applyTexToGroup(group, path){
  texLoader.load(path, (tex)=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(1, 1); tex.colorSpace = THREE.SRGBColorSpace;
    group.traverse((o)=>{ if (o.isMesh){ o.material.map = tex; o.material.color.setHex(0xffffff); o.material.needsUpdate = true; } });
  }, undefined, ()=>{});
}
function flatPlane(x, y, z, w, d, color, path, rx, ry, rotX){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color }));
  m.rotation.x = rotX === undefined ? -Math.PI / 2 : rotX; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m);
  if (path) applyTex(m, path, rx, ry); return m;
}

// ---- Ballroom ----
function box(x, y, z, w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color }));
  m.position.set(x, y, z); scene.add(m); return m;
}
function cyl(x, y, z, rTop, rBot, h, color) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 24), new THREE.MeshStandardMaterial({ color }));
  m.position.set(x, y, z); scene.add(m); return m;
}
// Floor + dance floor + walls, with the new ballroom textures.
const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALL_X * 2, HALL_Z * 2), new THREE.MeshStandardMaterial({ color: 0x6b4a26 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
applyTex(floor, 'assets/textures/ballroom_floor_polished_wood_honey_brown_1024.webp', 8, 6);
const dance = new THREE.Mesh(new THREE.PlaneGeometry(13, 9), new THREE.MeshStandardMaterial({ color: 0x8a5a2e }));
dance.rotation.x = -Math.PI / 2; dance.position.set(0, 0.02, -1); scene.add(dance);
applyTex(dance, 'assets/textures/ballroom_floor_herringbone_marble_border_1024.webp', 1, 1);
const walls = [
  box(0, 3, -HALL_Z - 0.5, HALL_X * 2 + 2, 6, 1, 0x5a2f22), // north wall
  box(0, 3, HALL_Z + 0.5, HALL_X * 2 + 2, 6, 1, 0x5a2f22), // south wall (entrance side)
  box(-HALL_X - 0.5, 3, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22),
  box(HALL_X + 0.5, 3, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22),
];
walls.forEach((w)=>applyTex(w, 'assets/textures/ballroom_wall_damask_burgundy_gold_1024.webp', 8, 2));
// Wood wainscoting strip along the lower walls (player clamp is ±19/±13,
// the strips sit at ±19.82/±13.82, so they are never walked into).
[[0, -13.82, 40, 0.2], [0, 13.82, 40, 0.2], [-19.82, 0, 0.2, 28], [19.82, 0, 0.2, 28]].forEach(([x, z, w, d])=>{
  const m = box(x, 0.6, z, w, 1.2, d, 0x3a2410); applyTex(m, 'assets/textures/ballroom_wall_wood_wainscoting_dark_1024.webp', 8, 1);
});
// Ceiling (was open) with plaster/moulding, plus curtains on the north wall.
flatPlane(0, 5.95, 0, HALL_X * 2, HALL_Z * 2, 0xe8ddc8, 'assets/textures/ballroom_ceiling_plaster_moulding_1024.webp', 6, 4, Math.PI / 2);
[-12, -4, 4, 12].forEach((x)=>{
  const c = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 3.5), new THREE.MeshStandardMaterial({ color: 0x5a1a2a }));
  c.position.set(x, 2.75, -13.65); scene.add(c); applyTex(c, 'assets/textures/ballroom_curtain_velvet_1024.webp', 1, 1);
});
// Carpet runner (entrance to dance floor) and a rug in front of the bar.
flatPlane(0, 0.03, 7.5, 2.5, 11, 0x7a1a1a, 'assets/textures/ballroom_carpet_runner_red_gold_border_1024.webp', 1, 4);
flatPlane(14, 0.04, 6, 6, 4, 0x5a2a3a, 'assets/textures/ballroom_rug_medallion_large_1024.webp', 1, 1);
// Exit door (north) + entrance (south): one single double-door texture.
const exitDoor = box(0, 1.5, -HALL_Z + 0.1, 3, 3, 0.3, 0x2e7d32);
applyTex(exitDoor, 'assets/textures/ballroom_door_double_mahogany_1024.webp', 1, 1);
const entranceDoor = box(0, 1.5, HALL_Z - 0.1, 3, 3, 0.3, 0x3a2a18);
applyTex(entranceDoor, 'assets/textures/ballroom_door_double_mahogany_1024.webp', 1, 1);
// Chandeliers: 6 now (3 north + 3 south, so the entrance side is no longer
// dark), brighter — point lights 30 -> 80, distance 22 -> 30. Real
// chandelier GLBs replace the spheres when loaded; lights stay.
const CHANDELIERS = [[-10, -4], [0, -1], [10, -4], [-10, 8], [0, 10], [10, 8]];
const chandelierProc = [];
CHANDELIERS.forEach(([x, z]) => {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffd97a, emissive: 0xffc94d, emissiveIntensity: 1.2 }));
  s.position.set(x, 5.2, z); scene.add(s); chandelierProc.push(s);
  const l = new THREE.PointLight(0xffc94d, 80, 30); l.position.set(x, 4.8, z); scene.add(l);
});
gltfLoader.load('assets/models/ballroom_chandelier.glb', (gltf)=>{
  CHANDELIERS.forEach(([x, z])=>{
    const g = fitPropGroup(gltf.scene.clone(), 1.1, 1.4, 1.1); if (!g) return;
    g.position.set(x, 5.2, z); scene.add(g); applyTexToGroup(g, 'assets/textures/ballroom_chandelier_crystal_glass_1024.webp');
  });
  chandelierProc.forEach((m)=>{ m.visible = false; });
}, undefined, ()=>{});
// Bar (east wall) — real bar + bar top GLBs replace the boxes when loaded.
const barProc = [box(17.5, 0.6, 6, 4, 1.2, 1.5, 0x4a2c14), box(17.5, 1.4, 6, 4, 0.15, 1.8, 0x7a4a22)];
loadProp('assets/models/ballroom_bar.glb', 17.5, 0.55, 6, 4, 1.1, 0.7, 0, [barProc[0]]);
loadProp('assets/models/ballroom_bar_top.glb', 17.5, 1.15, 6, 4, 0.1, 0.9, 0, [barProc[1]]);
// Bar counter texture as a thin top surface over the GLB bar top. If the
// GLB fails, this plane sits inside the procedural bar top box and is hidden.
flatPlane(17.5, 1.21, 6, 4, 0.9, 0x6a4a2a, 'assets/textures/ballroom_bar_counter_wood_marble_1024.webp', 1, 1);
// Round tables + chairs (colliders)
// Real table/chair GLBs replace the procedural ones when loaded; colliders
// are unchanged, so movement and talk radii do not change. Chairs move in
// from 2.1 m (for the old 3 m tables) to 1.2 m (for the 1.8 m GLB tables).
const tables = [[-13, 8], [-13, -9], [13, 9], [-6, 10], [7, -10], [14, -8]];
const colliders = []; // {x,z,r}
const tableProc = [], chairProc = [];
tables.forEach(([x, z]) => {
  tableProc.push(cyl(x, 0.45, z, 1.5, 1.5, 0.12, 0xf5ead0));
  tableProc.push(cyl(x, 0.2, z, 0.15, 0.25, 0.4, 0x3a2a18));
  colliders.push({ x, z, r: 1.9 });
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + 0.4;
    chairProc.push(box(x + Math.cos(a) * 2.1, 0.45, z + Math.sin(a) * 2.1, 0.5, 0.9, 0.5, 0x5a2f22));
  }
});
gltfLoader.load('assets/models/ballroom_table.glb', (gltf)=>{
  tables.forEach(([x, z])=>{
    const g = fitPropGroup(gltf.scene.clone(), 1.8, 0.75, 1.8); if (!g) return;
    g.position.set(x, 0.375, z); scene.add(g);
    // Linen tablecloth disc on top of the GLB table (top is at 0.75 m).
    const cloth = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.02, 24), new THREE.MeshStandardMaterial({ color: 0xf5ead0 }));
    cloth.position.set(x, 0.78, z); scene.add(cloth); applyTex(cloth, 'assets/textures/ballroom_tablecloth_linen_cream_1024.webp', 1, 1);
  });
  tableProc.forEach((m)=>{ m.visible = false; });
}, undefined, ()=>{});
gltfLoader.load('assets/models/ballroom_chair.glb', (gltf)=>{
  tables.forEach(([x, z])=>{
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + 0.4;
      const cx = x + Math.cos(a) * 1.2, cz = z + Math.sin(a) * 1.2;
      const g = fitPropGroup(gltf.scene.clone(), 0.57, 1.0, 0.6); if (!g) continue;
      g.position.set(cx, 0.5, cz); g.rotation.y = Math.atan2(x - cx, z - cz); scene.add(g);
      applyTexToGroup(g, 'assets/textures/ballroom_chair_upholstery_velvet_brocade_1024.webp');
    }
  });
  chairProc.forEach((m)=>{ m.visible = false; });
}, undefined, ()=>{});
colliders.push({ x: 17.5, z: 6, r: 2.6 });

// ---- ActionForge characters: real GLB models + baked clips ----
// The 5 remaining ActionForge guest GLBs share one 71-joint skeleton, so one set of baked
// clips (Mixamo idle/walk/talk/wave retargeted in Blender, world-space
// delta method, in-place, scale 1.667) drives all of them. The baked GLBs
// also contain the original Mixamo action — only the *_af clip is used.
// If a model GLB fails, its capsule stays; if a clip fails, that character
// just stands in its rest pose — nothing disappears.
const afClips = {};
[['idle', 'Standing_Idle_af'], ['walk', 'Walking_af'], ['talk', 'Talking_af'], ['wave', 'Waving_af']].forEach(([key, file]) => {
  gltfLoader.load('assets/animations_af/' + file + '.glb', (g) => {
    const c = g.animations.find(a => a.name.endsWith('_af'));
    if (c) afClips[key] = c;
  }, undefined, () => {});
});
function fitCharacter(obj, height) {
  obj.traverse((o)=>{ if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  let bb = new THREE.Box3().setFromObject(obj); const size = new THREE.Vector3(); bb.getSize(size);
  if (!size.y) return;
  obj.scale.setScalar(height / size.y);
  bb = new THREE.Box3().setFromObject(obj); const c = new THREE.Vector3(); bb.getCenter(c);
  obj.position.set(-c.x, -bb.min.y, -c.z);
}

// Mixamo guest loader (2026-11-03, single-texture rule): the four guests
// arrive as Mixamo FBXs with a __DEFAULT gray material and no maps, so
// the game applies their single basecolor PNG at load time (runtime
// reapply, not a Blender GLB — no Blender is available in this VM).
// FBX facing needs the PI turn, like the Kyle player / old FBX Donald.
function applyBasecolor(obj, texPath) {
  if (!texPath) return;
  const tex = texLoader.load(texPath);
  tex.colorSpace = THREE.SRGBColorSpace;
  obj.traverse((o)=>{ if (o.isMesh) { const mats = Array.isArray(o.material) ? o.material : [o.material]; mats.forEach((m)=>{ m.map = tex; m.color.set(0xffffff); m.needsUpdate = true; }); } });
}
function loadGuestModelMixamo(npc, path, texPath) {
  fbxLoader.load(path, (obj) => {
    fitCharacter(obj, 1.8);
    obj.rotation.y = (npc.turn || 0);
    applyBasecolor(obj, texPath);
    npc.group.add(obj); npc.model = obj;
    npc.mixer = new THREE.AnimationMixer(obj); npc._cur = null;
    (npc.capsuleParts || []).forEach((m)=>{ m.visible = false; });
    if (npc.role === 'donald' && npc.glass) npc.glass.position.set(-0.55, 1.35, 0.1);
  }, undefined, () => {});
}
function loadGuestModelDispatch(npc, path, texPath) {
  if (path.endsWith('.fbx')) loadGuestModelMixamo(npc, path, texPath);
  else loadGuestModel(npc, path);
}
function playCharClip(char, key) {
  if (!char.mixer || !afClips[key]) return;
  const act = char.mixer.clipAction(afClips[key]);
  if (char._cur === act && act.isRunning()) return;
  if (char._cur && char._cur !== act) char._cur.fadeOut(0.15);
  act.reset().fadeIn(0.15).play(); char._cur = act;
}
// ---- Player (Rochelle_undercover, Mixamo — no weapon is ever attached) ----
const player = new THREE.Group(); player.position.set(0, 0, 8); scene.add(player);
let playerModel = null, mixer = null;
const fbxLoader = new FBXLoader();
// Player Rochelle is now Mixamo (Rochelle_undercover_textured.glb), so
// she runs on the ORIGINAL Mixamo clips, not the baked *_af clips.
// Guests stay ActionForge and keep playCharClip/afClips below.
const mxClips = {};
function stripRootTravel(clip) {
  const tracks = clip.tracks.map((t) => {
    const nt = t.clone();
    const bone = t.name.split('.')[0].toLowerCase();
    if (bone.indexOf('hips') >= 0 && t.name.endsWith('.position') && nt.values && nt.values.length >= 3) {
      const x0 = nt.values[0], z0 = nt.values[2];
      for (let i = 0; i + 2 < nt.values.length; i += 3) { nt.values[i] = x0; nt.values[i + 2] = z0; }
    }
    return nt;
  });
  return new THREE.AnimationClip(clip.name, clip.duration, tracks);
}
[['idle', 'Standing_Idle.fbx'], ['walk', 'Walking.fbx'], ['talk', 'Talking.fbx'], ['wave', 'Waving.fbx']].forEach(([key, file]) => {
  fbxLoader.load('assets/animations/' + file, (obj) => {
    const raw = (obj.animations && obj.animations[0]) ? obj.animations[0] : null;
    if (raw) mxClips[key] = stripRootTravel(raw);
  }, undefined, () => {});
});
function playMxCharClip(char, key) {
  if (!char.mixer || !mxClips[key]) return;
  const act = char.mixer.clipAction(mxClips[key]);
  if (char._cur === act && act.isRunning()) return;
  if (char._cur && char._cur !== act) char._cur.fadeOut(0.15);
  act.reset().fadeIn(0.15).play(); char._cur = act;
}
fbxLoader.load('assets/models/Rochelle_undercover.fbx', (obj) => {
  fitCharacter(obj, 1.8);
  // Rochelle's FBX faces +Z in Three.js (0.88 wide in X, 0.23 deep in Z),
  // like the other guests: PI turns it to face forward for a player.
  obj.rotation.y = Math.PI;
  applyBasecolor(obj, 'assets/models/textures/Rochelle_basecolor.jpg');
  player.add(obj); playerModel = obj;
  mixer = new THREE.AnimationMixer(obj); player.mixer = mixer; player._cur = null;
}, undefined, () => {
  // Capsule fallback, still unarmed
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 1.1, 4, 12), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
  body.position.y = 1.0; player.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), new THREE.MeshStandardMaterial({ color: 0xd9a06b }));
  head.position.y = 1.95; player.add(head); playerModel = body;
});
function playClip(key) {
  // Player uses the original Mixamo clips; the guard in playMxCharClip
  // stops a running clip being reset every frame (that would freeze
  // walk/idle). Guests keep playCharClip/afClips.
  if (!player.mixer) return;
  playMxCharClip(player, key);
  mixer = player.mixer;
}

// ---- NPCs: original names/lines, friendly only ----
function nameSprite(text) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 48;
  const ctx = cv.getContext('2d'); ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, 256, 48);
  ctx.fillStyle = '#ffd97a'; ctx.fillText(text, 128, 33);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function makeGuest(npc) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 1.05, 4, 12), new THREE.MeshStandardMaterial({ color: npc.color }));
  body.position.y = 1.0; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, 16, 12), new THREE.MeshStandardMaterial({ color: npc.skin }));
  head.position.y = 1.92; g.add(head); npc.capsuleParts = [body, head];
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: nameSprite(npc.name), transparent: true }));
  sp.scale.set(2.2, 0.42, 1); sp.position.y = 2.45; g.add(sp);
  g.position.set(npc.x, 0, npc.z); scene.add(g);
  npc.group = g; npc.phase = Math.random() * 6.28; npc.wp = 0; npc.pause = 0;
  return npc;
}
// Real ActionForge model for a guest/contact: fits to 1.8 m, feet on the
// floor, facing +Z (ActionForge left hand is +X, so no PI turn is needed,
// unlike the old FBX Donald). Capsule + head hide on success only.
function loadGuestModel(npc, path) {
  gltfLoader.load(path, (gltf) => {

// ---- Cat chase + treats + Margo reveal ----
// Taming loop, all three cats: a cat runs from point to point away from

function setTreat(cat, on) {

function revealMargo() {

  const spots = [[18.8, 6], [-18, -11], [-17, 12]]; // behind bar, NW corner, SW corner
  const spot = spots[Math.floor(Math.random() * spots.length)];

  const steps = Math.max(2, Math.floor(dist / 1.25));
  const px = -dz / dist, pz = dx / dist; // perpendicular, for alternating paws

// ---- Loop ----
const clock = new THREE.Clock();
function animate() {

    const ease = (x) => x * x * (3 - 2 * x);
    if (ph >= 1) endCinematic();
  }
  if (missionStage === 'waiting' && photoIdx < 3 && clock.elapsedTime >= nextCineAt && nextCineAt > 0) {
    nextCineAt = 0; startCinematic(photoIdx);
  }
  if (windowOpen) {
    windowTimer -= dt;
    const sec = Math.ceil(windowTimer);
    if (sec !== lastWinSec) { lastWinSec = sec; updateMissionHUD(); }
    if (windowTimer <= 0) closeWindow();
  }
  if (started && !won && !cinematic) {
    let fx = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
    let fz = (keys['w'] ? 1 : 0) - (keys['s'] ? 1 : 0);
    if (joyId !== null) { fx += joyX; fz += -joyY; }
    const ml = Math.hypot(fx, fz);
    if (ml > 1) { fx /= ml; fz /= ml; }

    const dx = fx * Math.cos(yaw) - fz * Math.sin(yaw);
    const dz = -fx * Math.sin(yaw) - fz * Math.cos(yaw);

    player.position.x += dx * speed; player.position.z += dz * speed;

    player.position.z = Math.max(-HALL_Z + 1, Math.min(HALL_Z - 1, player.position.z));

      n.mixer.update(dt);

      else if (n.moving) playMxCharClip(n, 'walk');

    else k = 1 - ease((ph - 0.68) / 0.32); // pan back to Rochelle
    camera.position.lerpVectors(c.fromPos, c.toPos, k);
    const look = new THREE.Vector3().lerpVectors(c.fromLook, c.toLook, k);
    camera.lookAt(look);
  }
  renderer.render(scene, camera);
}
if (new URLSearchParams(location.search).has('test')) {
  window.__mission = { player, NPCS, CATS, PHOTOS, get photos() { return [...photos]; }, get photoIdx() { return photoIdx; }, get windowOpen() { return windowOpen; }, get missionStage() { return missionStage; }, get cinematic() { return cinematic; }, missionTarget, nearestTalk, startCinematic, updateMissionHUD, get won() { return won; } };
}
animate();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
