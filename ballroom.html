<body>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const HALL_X = 20, HALL_Z = 14;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x201409);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
scene.add(new THREE.AmbientLight(0xffe6b0, 0.55));
scene.add(new THREE.HemisphereLight(0xffe6b0, 0x3a2410, 0.4));

// ---- Ballroom ----
function box(x, y, z, w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color }));
  m.position.set(x, y, z); scene.add(m); return m;
}
function cyl(x, y, z, rTop, rBot, h, color) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 24), new THREE.MeshStandardMaterial({ color }));
  m.position.set(x, y, z); scene.add(m); return m;
}
// Floor + dance floor + walls
const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALL_X * 2, HALL_Z * 2), new THREE.MeshStandardMaterial({ color: 0x6b4a26 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const dance = new THREE.Mesh(new THREE.PlaneGeometry(13, 9), new THREE.MeshStandardMaterial({ color: 0x8a5a2e }));
dance.rotation.x = -Math.PI / 2; dance.position.set(0, 0.02, -1); scene.add(dance);
box(0, 3, -HALL_Z - 0.5, HALL_X * 2 + 2, 6, 1, 0x5a2f22); // north wall
box(0, 3, HALL_Z + 0.5, HALL_X * 2 + 2, 6, 1, 0x5a2f22); // south wall (entrance side)
box(-HALL_X - 0.5, 3, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22);
box(HALL_X + 0.5, 3, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22);
// Exit door (north) + entrance (south)
const exitDoor = box(0, 1.5, -HALL_Z + 0.1, 3, 3, 0.3, 0x2e7d32);
box(0, 1.5, HALL_Z - 0.1, 3, 3, 0.3, 0x3a2a18);
// Chandeliers: warm glow spheres + point lights (capped for phones)
[[-10, -4], [0, -1], [10, -4]].forEach(([x, z]) => {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffd97a, emissive: 0xffc94d, emissiveIntensity: 1.2 }));
  s.position.set(x, 5.2, z); scene.add(s);
  const l = new THREE.PointLight(0xffc94d, 30, 22); l.position.set(x, 4.8, z); scene.add(l);
});
// Bar (east wall)
box(17.5, 0.6, 6, 4, 1.2, 1.5, 0x4a2c14);
box(17.5, 1.4, 6, 4, 0.15, 1.8, 0x7a4a22);
// Round tables + chairs (colliders)
const tables = [[-13, 8], [-13, -9], [13, 9], [-6, 10], [7, -10], [14, -8]];
const colliders = []; // {x,z,r}
tables.forEach(([x, z]) => {
  cyl(x, 0.45, z, 1.5, 1.5, 0.12, 0xf5ead0);
  cyl(x, 0.2, z, 0.15, 0.25, 0.4, 0x3a2a18);
  colliders.push({ x, z, r: 1.9 });
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + 0.4;
    box(x + Math.cos(a) * 2.1, 0.45, z + Math.sin(a) * 2.1, 0.5, 0.9, 0.5, 0x5a2f22);
  }
});
colliders.push({ x: 17.5, z: 6, r: 2.6 });

// ---- Player (Agent_Kyle, unarmed — no weapon is ever attached) ----
const player = new THREE.Group(); player.position.set(0, 0, 12); scene.add(player);
let playerModel = null, mixer = null;
const clips = {};
const fbxLoader = new FBXLoader();
fbxLoader.load('assets/Agent_Kyle.fbx', (obj) => {
  const bb = new THREE.Box3().setFromObject(obj); const size = new THREE.Vector3(); bb.getSize(size);
  const s = 1.8 / Math.max(size.y, 0.01); obj.scale.setScalar(s);
  obj.rotation.y = Math.PI; player.add(obj); playerModel = obj;
  mixer = new THREE.AnimationMixer(obj);
  [['idle', 'Standing_Idle'], ['walk', 'Walking'], ['talk', 'Talking'], ['wave', 'Waving']].forEach(([key, file]) => {
    fbxLoader.load('assets/animations/' + file + '.fbx', (a) => {
      if (a.animations && a.animations[0]) {
        const c = a.animations[0];
        c.tracks = c.tracks.filter(t => !t.name.endsWith('.position') || t.name.toLowerCase().includes('hips'));
        clips[key] = c;
      }
    }, undefined, () => {});
  });
}, undefined, () => {
  // Capsule fallback, still unarmed
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 1.1, 4, 12), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
  body.position.y = 1.0; player.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), new THREE.MeshStandardMaterial({ color: 0xd9a06b }));
  head.position.y = 1.95; player.add(head); playerModel = body;
});
function playClip(key) {
  if (!mixer || !clips[key]) return;
  const act = mixer.clipAction(clips[key]);
  if (mixer._cur && mixer._cur !== act) mixer._cur.fadeOut(0.15);
  act.reset().fadeIn(0.15).play(); mixer._cur = act;
}

// ---- NPCs: original names/lines, friendly only ----
function nameSprite(text) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 48;
  const ctx = cv.getContext('2d'); ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, 256, 48);
  ctx.fillStyle = '#ffd97a'; ctx.fillText(text, 128, 33);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function makeGuest(npc) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 1.05, 4, 12), new THREE.MeshStandardMaterial({ color: npc.color }));
  body.position.y = 1.0; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, 16, 12), new THREE.MeshStandardMaterial({ color: npc.skin }));
  head.position.y = 1.92; g.add(head);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: nameSprite(npc.name), transparent: true }));
  sp.scale.set(2.2, 0.42, 1); sp.position.y = 2.45; g.add(sp);
  g.position.set(npc.x, 0, npc.z); scene.add(g);
  npc.group = g; npc.phase = Math.random() * 6.28; npc.wp = 0; npc.pause = 0;
  return npc;
}
const NPCS = [
  makeGuest({ name: 'Rochelle', role: 'contact', color: 0x0e5a3a, skin: 0xe8b48a, x: 15, z: 6, wps: [[15, 6], [12, 4], [16, 2]], lines: ['You found me. So — do you know the three words?', 'Come back when you have all three. The cats carry them on their collars.'] }),
  makeGuest({ name: 'Vickie', role: 'flavour', color: 0x7a2a5a, skin: 0xe8b48a, x: -12, z: 8, wps: [[-12, 8], [-9, 9], [-12, 5]], lines: ['The music is lovely — have you met the cats yet? One of them wears a tag that glitters.', 'Rochelle is near the bar, in green. She is the one to find.'] }),
  makeGuest({ name: 'Eric', role: 'flavour', color: 0x1a3a5a, skin: 0xc98a5a, x: 6, z: -10, wps: [[6, -10], [3, -9], [7, -7]], lines: ['I came for the dancing, but the cats stole the show.', 'Scan a collar tag if you get close to one — they seem to carry something.'] }),
  makeGuest({ name: 'Kristen', role: 'flavour', color: 0x3a1a5a, skin: 0xd9a06b, x: -8, z: -3, wps: [[-8, -3], [-6, -2]], lines: ['The cake at the bar is worth the trip alone.', 'If you are looking for Rochelle, try by the bar.'] }),
];
// ---- Donald: always has a drink in hand, stumbles, falls over at times ----
// He is friendly flavour only — talking to him never gives or blocks a clue.
// His spill (see the puddle below) is what the wet paw trail leads from.
const donald = makeGuest({ name: 'Donald', role: 'donald', color: 0x4a3a1a, skin: 0xe8b48a, x: 10, z: 4, wps: [[10, 4], [6, 6], [12, 8], [8, 2], [14, 5]], lines: [
  'The chandeliers are listening, I swear it. They blinked at me.',
  'I once danced with a lamp. Lovely lamp. Terrible dancer.',
  'A cat — a cat tried to steal my drink! Whiskers and all, reaching for my glass!',
  'I fell right over there and spilled my drink all over the floor. Oops. That puddle is mine.',
  'Shhh. The punch knows things. It told me. It did not, actually. I made that up.',
  'Have you seen my other shoe? It left me. I understand. I would leave me too.',
] });
{ // Drink in his hand, always — a small amber glass at his right side.
  const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.16, 10), new THREE.MeshStandardMaterial({ color: 0xd98a2a, transparent: true, opacity: 0.9 }));
  glass.position.set(0.48, 1.28, 0.15); donald.group.add(glass); donald.glass = glass;
}
// Donald's real model, from the file Kyle sent (assets/Donald_tux.fbx):
// a static Tripo mesh, no skeleton, so it is posed by the group itself —
// stumble, sway and fall all move the whole model, exactly like the
// capsule did. If the file fails to load, the capsule above stays.
fbxLoader.load('assets/Donald_tux.fbx', (obj) => {
  [...donald.group.children].forEach(ch => { if (ch !== donald.glass && ch.type !== 'Sprite') donald.group.remove(ch); });
  const holder = new THREE.Group(); holder.add(obj);
  let bb = new THREE.Box3().setFromObject(holder); const size = new THREE.Vector3(); bb.getSize(size);
  if (size.z > size.y * 1.5) obj.rotation.x = -Math.PI / 2; // Z-up Blender export: lay it upright
  bb = new THREE.Box3().setFromObject(holder); bb.getSize(size);
  holder.scale.setScalar(1.8 / Math.max(size.y, 0.01));
  bb = new THREE.Box3().setFromObject(holder); holder.position.y = -bb.min.y; // feet on the floor
  holder.rotation.y = Math.PI; // Agent_Kyle facing convention
  donald.group.add(holder);
}, undefined, () => {});
donald.fallTimer = 12 + Math.random() * 10; donald.falling = 0;
NPCS.push(donald);
// Donald's spill puddle, already on the floor when you arrive. Margo's
// wet paw trail runs from this puddle to wherever she is hiding.
const puddle = new THREE.Mesh(new THREE.CircleGeometry(0.85, 24), new THREE.MeshStandardMaterial({ color: 0x2a3a44, transparent: true, opacity: 0.6, roughness: 0.1 }));
puddle.rotation.x = -Math.PI / 2; puddle.position.set(9, 0.03, 4); scene.add(puddle);
const PUDDLE = { x: 9, z: 4 };

// ---- Cats: clue sources, friendly, never fightable/damageable ----
// Each cat wears a collar with an electronic ID tag. Walking up and
// pressing E / USE scans the tag and collects that cat's clue word.
function makeCat(cat) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12), new THREE.MeshStandardMaterial({ color: cat.color }));
  body.scale.set(1, 0.72, 1.5); body.position.y = 0.26; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), new THREE.MeshStandardMaterial({ color: cat.color }));
  head.position.set(0, 0.38, 0.42); g.add(head);
  // Mottled coat patches (tortoiseshell gray) or black-and-white patches:
  // small flattened blobs on the body so the coat reads as mixed, not solid.
  (cat.patches || []).forEach((p, i) => {
    const patch = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), new THREE.MeshStandardMaterial({ color: p }));
    patch.scale.set(1, 0.4, 1.4);
    patch.position.set(i % 2 === 0 ? -0.2 : 0.2, 0.42, i < 2 ? 0.12 : -0.28);
    g.add(patch);
  });
  const earGeo = new THREE.ConeGeometry(0.07, 0.14, 4);
  // Ears are their own colour on purpose: Moxie black ears, Mabel white ears.
  const earMat = new THREE.MeshStandardMaterial({ color: cat.earColor !== undefined ? cat.earColor : cat.color });
  const earL = new THREE.Mesh(earGeo, earMat); earL.position.set(-0.1, 0.55, 0.42); g.add(earL);
  const earR = new THREE.Mesh(earGeo, earMat); earR.position.set(0.1, 0.55, 0.42); g.add(earR);
  // Nose is its own colour on purpose: Moxie black nose, Mabel pink nose.
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), new THREE.MeshStandardMaterial({ color: cat.noseColor !== undefined ? cat.noseColor : 0x111111 }));
  nose.position.set(0, 0.36, 0.62); g.add(nose);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.45), new THREE.MeshStandardMaterial({ color: cat.color }));
  tail.position.set(0, 0.32, -0.55); tail.rotation.x = 0.4; g.add(tail);
  // Collar + glowing electronic ID tag
  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.025, 8, 20), new THREE.MeshStandardMaterial({ color: 0x111111 }));
  collar.position.set(0, 0.34, 0.32); collar.rotation.x = 0.5; g.add(collar);
  const tag = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.14, 0.02), new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 1.4 }));
  tag.position.set(0, 0.22, 0.48); g.add(tag);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: nameSprite(cat.name + ' 🐱'), transparent: true }));
  sp.scale.set(2.2, 0.42, 1); sp.position.y = 0.85; g.add(sp);
  g.position.set(cat.x, 0, cat.z); scene.add(g);
  cat.group = g; cat.phase = Math.random() * 6.28; cat.wp = 0; cat.pause = 0;
  // Margo starts hidden (see below) — she only appears once Moxie and
  // Mabel have both been caught, so she is never wanderable before that.
  if (cat.hidden) g.visible = false;
  return cat;
}
const CATS = [
  // Margo: tortoiseshell gray (mottled gray coat), harder to find — she
  // sticks to secluded corners/edges and pauses much longer between moves.
  makeCat({ name: 'Margo', role: 'cat', clue: 'velvet', color: 0x8a8a8a, patches: [0x555555, 0xb0b0b0, 0x666666], earColor: 0x555555, noseColor: 0x111111, shy: true, hidden: true, x: -17, z: 11, wps: [[-17, 11]], lines: ['*purr* — Tag scan: velvet. Collar ID registered.', 'Margo stretches and pads away.'] }),
  // Moxie: black and white, black ears, black nose. Easy to find, but she
  // runs from point to point — give her a treat at each stop to try a scan.
  makeCat({ name: 'Moxie', role: 'cat', clue: 'midnight', color: 0x1a1a1a, patches: [0xf0f0f0, 0xffffff], earColor: 0x111111, noseColor: 0x111111, chase: true, fed: false, fedTimer: 0, fleeing: false, treatsGiven: 0, x: 4, z: 8, wps: [[4, 8], [7, 9], [5, 5], [-5, 9], [10, 2], [-3, 10]], lines: ['*purr* — Tag scan: midnight. Collar ID registered.', 'Moxie flicks her tail and sits down.'] }),
  // Mabel: black and white, white ears, pink nose. Same treat rule as Moxie.
  makeCat({ name: 'Mabel', role: 'cat', clue: 'waltz', color: 0x1a1a1a, patches: [0xf0f0f0, 0xffffff], earColor: 0xffffff, noseColor: 0xff9eb0, chase: true, fed: false, fedTimer: 0, fleeing: false, treatsGiven: 0, x: -1, z: -7, wps: [[-1, -7], [2, -6], [-2, -4], [-8, -8], [6, -3], [-6, 2]], lines: ['*purr* — Tag scan: waltz. Collar ID registered.', 'Mabel blinks slowly at you.'] }),
];
// Cats join the talkable/wandering set, so E / USE, prompts, and
// wandering all work for them exactly like the guests. They have no
// health, damage, or combat code anywhere — they cannot be fought.
NPCS.push(...CATS);

// ---- Goal state ----
const clues = new Set(); let contactFound = false, won = false, talking = null, lineIdx = 0;
// ---- Cat chase + treats + Margo reveal ----
// Taming loop, all three cats: a cat runs from point to point away from
// you. At each stop, press E / USE once to give it a treat — it stays put
// for a few seconds — then press E / USE again to scan its tag. If you
// wait too long after the treat, it runs to the next point and you have
// to give it another treat to try again. Treats are unlimited; there is
// no treat pickup or inventory to manage.
function setTreat(cat, on) {
  if (!cat.group) return;
  if (!cat.treatMesh) {
    cat.treatMesh = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), new THREE.MeshStandardMaterial({ color: 0x8a5a2e }));
    cat.treatMesh.position.set(0, 0.06, 0.6); cat.group.add(cat.treatMesh);
  }
  cat.treatMesh.visible = on;
}
function fleeCat(cat) {
  cat.fed = false; cat.fedTimer = 0; setTreat(cat, false);
  if (cat.hiding) return; // Margo stays in her hiding place; she does not flee
  cat.wp = (cat.wp + 1) % cat.wps.length; cat.fleeing = true; cat.pause = 0;
}
// Margo is hidden until both easy cats are caught. She then appears at one
// of a few hiding places, with a trail of wet paw marks from Donald's spill
// puddle leading to her — follow the prints to find her.
let margoRevealed = false, trailGroup = null;
function revealMargo() {
  if (margoRevealed) return;
  const margo = CATS.find(c => c.name === 'Margo'); if (!margo) return;
  const spots = [[18.8, 6], [-18, -11], [-17, 12]]; // behind bar, NW corner, SW corner
  const spot = spots[Math.floor(Math.random() * spots.length)];
  margo.group.position.set(spot[0], 0, spot[1]);
  margo.wps = [[spot[0], spot[1]]]; margo.wp = 0; margo.hiding = true; margo.hidden = false;
  margo.group.visible = true; margoRevealed = true;
  if (trailGroup) { scene.remove(trailGroup); trailGroup = null; }
  trailGroup = new THREE.Group();
  const dx = spot[0] - PUDDLE.x, dz = spot[1] - PUDDLE.z, dist = Math.hypot(dx, dz);
  const steps = Math.max(2, Math.floor(dist / 1.25));
  const px = -dz / dist, pz = dx / dist; // perpendicular, for alternating paws
  for (let i = 1; i <= steps; i++) {
    const f = i / steps, side = (i % 2 === 0 ? 1 : -1) * 0.18;
    const print = new THREE.Mesh(new THREE.CircleGeometry(0.12, 12), new THREE.MeshStandardMaterial({ color: 0x1a2a33, transparent: true, opacity: 0.7 }));
    print.rotation.x = -Math.PI / 2;
    print.position.set(PUDDLE.x + dx * f + px * side, 0.04, PUDDLE.z + dz * f + pz * side);
    trailGroup.add(print);
  }
  scene.add(trailGroup);
}
const clueEl = document.getElementById('clueCount'), contactEl = document.getElementById('contactState');
function updateHUD() {
  if(clueEl) clueEl.textContent = clues.size + '/3';
  if(contactEl) contactEl.textContent = contactFound ? 'found ✓' : 'not found';
  exitDoor.material.color.set(contactFound ? 0x2e7d32 : 0x7a2020);
}
updateHUD();
function talkTo(npc) {
  talking = npc; lineIdx = 0;
  // A cat with no treat yet: this press gives it a treat, it stays put
  // briefly, and no clue is collected. The next press scans it.
  if (npc.role === 'cat' && !npc.fed) {
    showLine(); npc.fed = true; npc.fedTimer = 12; npc.treatsGiven = (npc.treatsGiven || 0) + 1; setTreat(npc, true); return;
  }
  showLine();
  if (npc.role === 'cat' && !clues.has(npc.clue)) {
    npc.fed = false; npc.fedTimer = 0; setTreat(npc, false);
    clues.add(npc.clue);
    if (clues.has('midnight') && clues.has('waltz')) revealMargo();
  }
  if (npc.role === 'contact' && clues.size === 3) { contactFound = true; }
  updateHUD();
}
function showLine() {
  if (!talking) return;
  let line = talking.lines[lineIdx % talking.lines.length];
  if (talking.role === 'cat' && !talking.fed) line = 'You offer ' + talking.name + ' a treat. She sniffs it, eats it, and stays put — quick, press E / USE again to scan her tag before she changes her mind.';
  if (talking.role === 'contact' && clues.size < 3 && !contactFound) line = 'I can only trust someone who knows all three passphrase words. The cats carry them — scan the ID tags on Margo, Moxie, and Mabel.';
  if (talking.role === 'contact' && contactFound) line = 'Velvet, midnight, waltz — that is right. The north door is open. Go, quietly.';
  document.getElementById('dlgName').textContent = talking.name;
  document.getElementById('dlgLine').textContent = line;
  document.getElementById('dialog').style.display = 'block';
  playClip('talk');
}
function endTalk() { talking = null; document.getElementById('dialog').style.display = 'none'; }

// ---- Input: keyboard + touch (no combat controls anywhere) ----
const keys = {};
let yaw = Math.PI, pitch = 0.15, started = false, joyId = null, joyX = 0, joyY = 0, lookId = null, lastLX = 0, lastLY = 0;
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
document.getElementById('startBtn').onclick = () => {
  document.getElementById('overlay').style.display = 'none'; started = true;
  if (!isTouch) renderer.domElement.requestPointerLock();
};
addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'e' && started) nearestTalk();
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
addEventListener('mousemove', (e) => {
  if (document.pointerLockElement && started) { yaw -= e.movementX * 0.003; pitch = Math.max(-0.4, Math.min(0.5, pitch - e.movementY * 0.003)); }
});
const joy = document.getElementById('joy'), knob = document.getElementById('knob');
joy.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; joyId = t.identifier; moveJoy(t); e.preventDefault(); }, { passive: false });
joy.addEventListener('touchmove', (e) => { for (const t of e.changedTouches) if (t.identifier === joyId) moveJoy(t); e.preventDefault(); }, { passive: false });
function endJoy(e) { for (const t of e.changedTouches) if (t.identifier === joyId) { joyId = null; joyX = joyY = 0; knob.style.left = '37px'; knob.style.top = '37px'; } }
joy.addEventListener('touchend', endJoy); joy.addEventListener('touchcancel', endJoy);
function moveJoy(t) {
  const r = joy.getBoundingClientRect(); const dx = (t.clientX - (r.left + 65)) / 50, dy = (t.clientY - (r.top + 65)) / 50;
  const m = Math.min(1, Math.hypot(dx, dy)) || 1; joyX = dx / Math.max(1, Math.hypot(dx, dy)) * m; joyY = dy / Math.max(1, Math.hypot(dx, dy)) * m;
  knob.style.left = (37 + joyX * 35) + 'px'; knob.style.top = (37 + joyY * 35) + 'px';
}
renderer.domElement.addEventListener('touchstart', (e) => {
  if (!started) return;
  for (const t of e.changedTouches) { if (t.identifier !== joyId) { lookId = t.identifier; lastLX = t.clientX; lastLY = t.clientY; } }
}, { passive: true });
renderer.domElement.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) if (t.identifier === lookId) {
    yaw -= (t.clientX - lastLX) * 0.005; pitch = Math.max(-0.4, Math.min(0.5, pitch - (t.clientY - lastLY) * 0.005));
    lastLX = t.clientX; lastLY = t.clientY;
  }
}, { passive: true });
renderer.domElement.addEventListener('touchend', (e) => { for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null; });
document.getElementById('useBtn').onclick = () => { if (started) nearestTalk(); };

function nearestTalk() {
  let best = null, bd = 3.2;
  for (const n of NPCS) { if (!n.group.visible) continue; const d = n.group.position.distanceTo(player.position); if (d < bd) { bd = d; best = n; } }
  if (best) {
    // A cat fed mid-conversation: a fresh press scans it, instead of just
    // cycling to its second line and never collecting.
    if (talking === best && best.role === 'cat' && best.fed && !clues.has(best.clue)) talkTo(best);
    else if (talking === best) { lineIdx++; showLine(); } else talkTo(best);
  }
  else if (talking) endTalk();
  else {
    // Near exit?
    if (Math.hypot(player.position.x, player.position.z + HALL_Z) < 2.5) {
      if (contactFound && !won) { won = true; document.getElementById('winText').textContent = 'You scanned all 3 cat collar tags (velvet, midnight, waltz), found Rochelle, and slipped out the north door — without a single fight.'; document.getElementById('win').style.display = 'flex'; }
    }
  }
}

// ---- Loop ----
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); const t = clock.elapsedTime;
  if (started && !won) {
    let fx = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
    let fz = (keys['w'] ? 1 : 0) - (keys['s'] ? 1 : 0);
    if (joyId !== null) { fx += joyX; fz += -joyY; }
    const ml = Math.hypot(fx, fz);
    if (ml > 1) { fx /= ml; fz /= ml; }
    // Camera-forward movement (same fix as the courtyard game: forward = -sin/-cos)
    const dx = fx * Math.cos(yaw) - fz * Math.sin(yaw);
    const dz = -fx * Math.sin(yaw) - fz * Math.cos(yaw);
    const speed = (keys['shift'] ? 5.5 : 4) * dt;
    player.position.x += dx * speed; player.position.z += dz * speed;
    player.position.x = Math.max(-HALL_X + 1, Math.min(HALL_X - 1, player.position.x));
    player.position.z = Math.max(-HALL_Z + 1, Math.min(HALL_Z - 1, player.position.z));
    for (const c of colliders) {
      const ddx = player.position.x - c.x, ddz = player.position.z - c.z, d = Math.hypot(ddx, ddz);
      if (d < c.r && d > 0.01) { player.position.x = c.x + ddx / d * c.r; player.position.z = c.z + ddz / d * c.r; }
    }
    player.rotation.y = yaw;
    if (mixer) { mixer.update(dt); if (!talking) playClip(ml > 0.1 ? 'walk' : 'idle'); }
    // Prompt / exit proximity
    let best = null, bd = 3.2;
    for (const n of NPCS) { if (!n.group.visible) continue; const d = n.group.position.distanceTo(player.position); if (d < bd) { bd = d; best = n; } }
    const prompt = document.getElementById('prompt');
    // The prompt element was removed with the HUD text, so prompt is null:
    // only end a conversation when nobody is nearby, not on every frame.
    // (Without this, dialogue closed one frame after opening.)
    if (best) { if (prompt) { prompt.textContent = (best.role === 'cat' ? (best.fed ? 'Scan ' + best.name + '\'s collar tag' : 'Give ' + best.name + ' a treat') : 'Talk to ' + best.name) + ' — press E / USE'; prompt.style.display = 'block'; } }
    else if (Math.hypot(player.position.x, player.position.z + HALL_Z) < 2.5) {
      if (prompt) { prompt.textContent = contactFound ? 'North exit open — press E / USE to leave' : 'North exit is locked — find Rochelle first (gather 3 clues)'; prompt.style.display = 'block'; }
    } else { if (prompt) prompt.style.display = 'none'; if (talking) endTalk(); }
    // NPC wander + sway
    for (const n of NPCS) {
      if (n === talking) continue;
      if (!n.group.visible) continue; // hidden Margo: not in the hall yet
      if (n.role === 'donald') {
        // Stumble walk: slow, wobbling, and every so often he falls down
        // flat for a couple of seconds, drink still in hand, then gets up.
        if (n.falling > 0) { n.falling -= dt; n.group.rotation.x = -1.35; if (n.falling <= 0) { n.group.rotation.x = 0; n.fallTimer = 14 + Math.random() * 14; } continue; }
        n.fallTimer -= dt; if (n.fallTimer <= 0) { n.falling = 2.2; continue; }
        n.group.rotation.z = Math.sin(t * 3 + n.phase) * 0.12;
        n.group.position.y = Math.abs(Math.sin(t * 2 + n.phase)) * 0.04;
        if (n.pause > 0) { n.pause -= dt; continue; }
        const wp = n.wps[n.wp]; const ddx = wp[0] - n.group.position.x, ddz = wp[1] - n.group.position.z, d = Math.hypot(ddx, ddz);
        if (d < 0.3) { n.wp = (n.wp + 1) % n.wps.length; n.pause = 1 + Math.random() * 2; }
        else { const sp = 0.7 + 0.3 * Math.sin(t * 1.7 + n.phase); n.group.position.x += ddx / d * sp * dt; n.group.position.z += ddz / d * sp * dt; n.group.rotation.y = Math.atan2(ddx, ddz); }
        continue;
      }
      if (n.role === 'cat' && n.hiding) {
        // Margo stays put in her hiding place, but a treat still expires:
        // wait too long and you have to give her another one to scan.
        if (n.fed) { n.fedTimer -= dt; if (n.fedTimer <= 0) { n.fed = false; setTreat(n, false); } }
        continue;
      }
      if (n.role === 'cat' && n.fed) {
        // Fed cat sits still, ready to scan — until the treat window runs out.
        n.fedTimer -= dt;
        if (n.fedTimer <= 0) { fleeCat(n); continue; }
        continue;
      }
      n.group.position.y = Math.abs(Math.sin(t * 1.5 + n.phase)) * 0.03;
      if (n.pause > 0) { n.pause -= dt; continue; }
      // Getting close to an unfed chase cat spooks it into running.
      if (n.role === 'cat' && n.chase && !n.fed && !n.fleeing && n.group.position.distanceTo(player.position) < 2.0) { fleeCat(n); continue; }
      const wp = n.wps[n.wp]; const ddx = wp[0] - n.group.position.x, ddz = wp[1] - n.group.position.z, d = Math.hypot(ddx, ddz);
      if (d < 0.3) {
        if (n.fleeing) { n.fleeing = false; n.pause = 1.5; }
        else { n.wp = (n.wp + 1) % n.wps.length; n.pause = n.shy ? 6 + Math.random() * 4 : 2 + Math.random() * 3; }
      }
      else { const sp = n.fleeing ? 2.6 : (n.shy ? 0.5 : 0.8); n.group.position.x += ddx / d * sp * dt; n.group.position.z += ddz / d * sp * dt; n.group.rotation.y = Math.atan2(ddx, ddz); }
    }
  }
  const back = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  camera.position.set(player.position.x + back.x * 5, 2.6, player.position.z + back.z * 5);
  camera.lookAt(player.position.x - back.x * 3, 1.6, player.position.z - back.z * 3);
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
