import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// Human characters stand 5 cm off the floor (feet less likely to clip
// into / sink below it). Added to every human character's standing Y:
// player spawn + teleport, guest spawn, guest idle bob (cats are NOT
// lifted — they sit/lie on the floor).
const CHAR_LIFT = 0.05;
const gltfLoader = new GLTFLoader();
// Draco decoder: most GLBs in this repo are Draco-compressed (white_lambo, weapons, ballroom props, cats).
// Without this, GLTFLoader throws 'No DRACOLoader instance provided' and the model silently fails to load.
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
gltfLoader.setDRACOLoader(dracoLoader);
// GLB prop helper: fit a loaded model to target W/H/D (non-uniform, so it
// matches the footprint it replaces), centre it in a group, and return the
// group. The caller places the group: base-anchored props sit at y = targetH/2
// (so the model base is on the floor), centre-anchored props at the centre.
// If a GLB fails to load, the caller keeps its procedural mesh — nothing
// disappears, the room just keeps its old look.
function fitPropGroup(obj, targetW, targetH, targetD){
  obj.traverse((o)=>{ if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  let bb = new THREE.Box3().setFromObject(obj); const size = new THREE.Vector3(); bb.getSize(size);
  if (!size.x || !size.y || !size.z) return null;
  obj.scale.set(targetW / size.x, targetH / size.y, targetD / size.z);
  bb = new THREE.Box3().setFromObject(obj); const c = new THREE.Vector3(); bb.getCenter(c);
  obj.position.set(-c.x, -c.y, -c.z);
  const g = new THREE.Group(); g.add(obj); return g;
}
function loadProp(path, x, y, z, targetW, targetH, targetD, rotY, hide){
  gltfLoader.load(path, (gltf)=>{
    const g = fitPropGroup(gltf.scene, targetW, targetH, targetD); if (!g) return;
    g.position.set(x, y, z); if (rotY) g.rotation.y = rotY; scene.add(g);
    (hide || []).forEach((m)=>{ if (m) m.visible = false; });
  }, undefined, ()=>{ /* keep procedural fallback */ });
}

const HALL_X = 20, HALL_Z = 14;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x201409);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
scene.add(new THREE.AmbientLight(0xffe6b0, 0.85));
scene.add(new THREE.HemisphereLight(0xffe6b0, 0x3a2410, 0.6));
// Ballroom textures (user uploads, assets/textures/): flat colour stays
// until the texture arrives, and stays forever if it fails to load.
const texLoader = new THREE.TextureLoader();
function applyTex(mesh, path, rx, ry, rot){
  texLoader.load(path, (tex)=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(rx, ry); tex.colorSpace = THREE.SRGBColorSpace;
    if (rot) { tex.center.set(0.5, 0.5); tex.rotation = rot; }
    mesh.material.map = tex; mesh.material.color.setHex(0xffffff); mesh.material.needsUpdate = true;
  }, undefined, ()=>{});
}
function applyTexToGroup(group, path){
  texLoader.load(path, (tex)=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(1, 1); tex.colorSpace = THREE.SRGBColorSpace;
    group.traverse((o)=>{ if (o.isMesh){ o.material.map = tex; o.material.color.setHex(0xffffff); o.material.needsUpdate = true; } });
  }, undefined, ()=>{});
}
function flatPlane(x, y, z, w, d, color, path, rx, ry, rotX, rot){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color }));
  m.rotation.x = rotX === undefined ? -Math.PI / 2 : rotX; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m);
  if (path) applyTex(m, path, rx, ry, rot); return m;
}

// ---- Ballroom ----
function box(x, y, z, w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color }));
  m.position.set(x, y, z); scene.add(m); return m;
}
function cyl(x, y, z, rTop, rBot, h, color) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 24), new THREE.MeshStandardMaterial({ color }));
  m.position.set(x, y, z); scene.add(m); return m;
}
// Floor + dance floor + walls, with the new ballroom textures.
const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALL_X * 2, HALL_Z * 2), new THREE.MeshStandardMaterial({ color: 0x6b4a26 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
applyTex(floor, 'assets/textures/ballroom/ballroom_floor_polished_wood_honey_brown_1024.webp', 8, 6);
const dance = new THREE.Mesh(new THREE.PlaneGeometry(13, 9), new THREE.MeshStandardMaterial({ color: 0x8a5a2e }));
dance.rotation.x = -Math.PI / 2; dance.position.set(0, 0.02, -1); scene.add(dance);
applyTex(dance, 'assets/textures/ballroom/ballroom_floor_herringbone_marble_border_1024.webp', 1, 1);
const walls = [
  box(0, 3, -HALL_Z - 0.5, HALL_X * 2 + 2, 6, 1, 0x5a2f22), // north wall
  box(0, 3, HALL_Z + 0.5, HALL_X * 2 + 2, 6, 1, 0x5a2f22), // south wall (entrance side)
  box(-HALL_X - 0.5, 3, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22),
  box(HALL_X + 0.5, 3, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22),
];
walls.forEach((w)=>applyTex(w, 'assets/textures/ballroom/ballroom_wall_damask_burgundy_gold_1024.webp', 8, 2));
// Wood wainscoting strip along the lower walls (player clamp is ±19/±13,
// the strips sit at ±19.82/±13.82, so they are never walked into).
[[0, -13.82, 40, 0.2], [0, 13.82, 40, 0.2], [-19.82, 0, 0.2, 28], [19.82, 0, 0.2, 28]].forEach(([x, z, w, d])=>{
  const m = box(x, 0.6, z, w, 1.2, d, 0x3a2410);
  // Square tiles: the wainscoting texture is a 4x4 panel grid, so repeat
  // the long dimension in 1.2 m tiles (each tile 1.2x1.2 m, each panel
  // 0.3 m square). The old repeat (8,1) stretched the panels ~4:1 wide.
  applyTex(m, 'assets/textures/ballroom/ballroom_wall_wood_wainscoting_dark_1024.webp', Math.max(w, d) / 1.2, 1);
});
// Upper walls + ceiling (2026-11-11, ported from ballroom-handoff.html —
// one room, same in all three pages): the ballroom is two stories tall.
// The upper walls rise from the ground-floor ceiling line (y=5.95) to the
// upper ceiling at y=11.95. Same damask wallpaper as the ground-floor
// walls, 2 m high texture repeat. The south wall leaves a 4 m wide
// opening (x -2..2) for the south balcony window; the ground-floor south
// wall stays solid below it. The ceiling plane is 0.05 above the upper
// walls' tops (11.9), so it never z-fights them.
const upperWalls = [
  box(0, 9, -HALL_Z - 0.5, HALL_X * 2 + 2, 6, 1, 0x5a2f22), // north upper wall
  box(-11, 9, HALL_Z + 0.5, HALL_X * 2 - 20, 6, 1, 0x5a2f22), // south upper wall, west of the balcony window
  box(11, 9, HALL_Z + 0.5, HALL_X * 2 - 20, 6, 1, 0x5a2f22), // south upper wall, east of the balcony window
  box(-HALL_X - 0.5, 9, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22), // west upper wall
  box(HALL_X + 0.5, 9, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22), // east upper wall
];
upperWalls.forEach((w)=>applyTex(w, 'assets/textures/ballroom/ballroom_wall_damask_burgundy_gold_1024.webp', 8, 2));
flatPlane(0, 11.95, 0, HALL_X * 2, HALL_Z * 2, 0xe8ddc8, 'assets/textures/ballroom/ballroom_ceiling_plaster_moulding_1024.webp', 6, 4, Math.PI / 2); // ceiling at the top of the second story
// Wall trim (2026-11-11): thin solid-color strips along the walls — crown
// molding below the ceiling, baseboard at the floor, chair rail capping
// the wainscoting. Each strip sits proud of the face behind it (its back
// face at least 0.01 m in front of that face) so no trim face is coplanar
// with a wall or wainscoting face. inset = how far the back face sits in
// front of the wall face (0.01 = just proud of the bare wall; 0.29 = just
// proud of the wainscoting, whose room face is 0.28 in front of the wall).
function addTrim(y, h, d, color, inset) {
  box(0, y, -HALL_Z + inset + d / 2, HALL_X * 2, h, d, color); // north
  box(0, y, HALL_Z - inset - d / 2, HALL_X * 2, h, d, color); // south
  box(-HALL_X + inset + d / 2, y, 0, d, h, HALL_Z * 2, color); // west
  box(HALL_X - inset - d / 2, y, 0, d, h, HALL_Z * 2, color); // east
}
addTrim(5.85, 0.15, 0.14, 0xe8ddc8, 0.01); // crown molding, cream, just below the ceiling
addTrim(0.1, 0.2, 0.08, 0x3a2410, 0.29); // baseboard, dark wood, proud of the wainscoting
addTrim(1.2, 0.08, 0.08, 0x3a2410, 0.29); // chair rail, dark wood, capping the wainscoting
addTrim(11.85, 0.15, 0.14, 0xe8ddc8, 0.01); // upper crown molding, cream, just below the upper ceiling (11.95)
// Balcony trim: baseboard-height trim along the balcony floor edges where
// the balcony meets the upper walls (north balcony north edge, south
// balcony south edge, east walkway east edge). Proud of the upper wall
// faces by 0.01, same dark wood as the baseboard.
box(11, 6.1, -13.95, 12, 0.2, 0.08, 0x3a2410); // north balcony, x 5..17, against the north wall
box(0, 6.1, 13.95, 12, 0.2, 0.08, 0x3a2410); // south balcony, x -6..6, against the south wall
box(19.95, 6.1, 0, 0.08, 0.2, 27.8, 0x3a2410); // east walkway, z -13.9..13.9, against the east wall

// ---- Interior windows + curtain rods (night ball, 2026-11-07) ----
// Tall white-framed windows on the interior walls, night sky behind the
// glass (it is a nighttime ball and the walls are solid). Dark-brass rods
// above them with velvet curtains pulled to the sides of each window.
// Placed on real wall faces (interior faces at z +/-14, x +/-20), clear
// of the doors, the bar, and the tables.
function nightSkyTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 384;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 384);
  grad.addColorStop(0, '#05081f'); grad.addColorStop(0.55, '#0d1740'); grad.addColorStop(1, '#1c2547');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 384);
  for (let i = 0; i < 80; i++) {
    g.fillStyle = 'rgba(255,255,255,' + (0.25 + Math.random() * 0.75).toFixed(2) + ')';
    const s = Math.random() * 1.6 + 0.6;
    g.fillRect(Math.random() * 256, Math.random() * 250, s, s);
  }
  const glow = g.createRadialGradient(192, 72, 4, 192, 72, 78);
  glow.addColorStop(0, 'rgba(255,244,200,0.9)');
  glow.addColorStop(0.35, 'rgba(255,244,200,0.22)');
  glow.addColorStop(1, 'rgba(255,244,200,0)');
  g.fillStyle = glow; g.fillRect(104, 0, 152, 160);
  g.fillStyle = '#fdf6d8'; g.beginPath(); g.arc(192, 72, 20, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(190,180,140,0.55)';
  g.beginPath(); g.arc(186, 66, 4, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(198, 78, 3, 0, Math.PI * 2); g.fill();
  // Distant rooftops along the bottom, a few lit windows.
  g.fillStyle = '#04060e';
  g.beginPath(); g.moveTo(0, 384); g.lineTo(0, 320); g.lineTo(40, 296); g.lineTo(80, 320); g.lineTo(120, 300); g.lineTo(170, 324); g.lineTo(210, 302); g.lineTo(256, 322); g.lineTo(256, 384); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,214,120,0.9)';
  g.fillRect(52, 312, 5, 7); g.fillRect(140, 316, 5, 7); g.fillRect(200, 312, 5, 7);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}
const NIGHT_SKY = nightSkyTexture();
function addWindow(x, z, rotY) {
  // Group local +Z faces into the room. 1.7 m wide x 3.4 m tall, centre
  // y 3.1 (above the 1.2 m wainscoting, below the 6 m ceiling).
  const g = new THREE.Group();
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xf5efe0, roughness: 0.6 });
  const W = 1.7, H = 3.4;
  const rail = (w, h, px, py) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), frameMat); m.position.set(px, py, 0); m.castShadow = true; g.add(m); return m; };
  rail(W, 0.09, 0, H / 2 - 0.045); rail(W, 0.09, 0, -H / 2 + 0.045);
  rail(0.09, H, -W / 2 + 0.045, 0); rail(0.09, H, W / 2 - 0.045, 0);
  const sill = new THREE.Mesh(new THREE.BoxGeometry(W + 0.16, 0.07, 0.14), frameMat);
  sill.position.set(0, -H / 2 - 0.035, 0.03); g.add(sill);
  // Night-sky glass, faintly glowing so it reads at night.
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.18, H - 0.18), new THREE.MeshStandardMaterial({ map: NIGHT_SKY, emissive: 0x8a9ac0, emissiveMap: NIGHT_SKY, emissiveIntensity: 0.35, roughness: 0.15, metalness: 0.2 }));
  glass.position.set(0, 0, -0.01); g.add(glass);
  // Mullions: one vertical, two horizontal.
  const mv = new THREE.Mesh(new THREE.BoxGeometry(0.05, H - 0.18, 0.03), frameMat); mv.position.set(0, 0, 0.01); g.add(mv);
  [-H / 6, H / 6].forEach((py) => { const mh = new THREE.Mesh(new THREE.BoxGeometry(W - 0.18, 0.05, 0.03), frameMat); mh.position.set(0, py, 0.01); g.add(mh); });
  // Curtain rod above: dark brass, finials, two brackets. Velvet curtains
  // hang from the rod, pulled to the sides of the window — flanking the
  // glass, never covering it. Panel top at the rod, bottom at the
  // wainscoting top (world y 1.2).
  const brass = new THREE.MeshStandardMaterial({ color: 0x8a6b2f, metalness: 0.85, roughness: 0.35 });
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, W + 0.5, 12), brass);
  rod.rotation.z = Math.PI / 2; rod.position.set(0, H / 2 + 0.32, 0.12); g.add(rod);
  [-1, 1].forEach((s) => {
    const fin = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), brass);
    fin.position.set(s * (W / 2 + 0.25), H / 2 + 0.32, 0.12); g.add(fin);
    const br = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.1, 0.12), brass);
    br.position.set(s * (W / 2 - 0.1), H / 2 + 0.32, 0.06); g.add(br);
    const cp = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 3.9), new THREE.MeshStandardMaterial({ color: 0x5a1a2a }));
    cp.position.set(s * (W / 2 + 0.28), 0.06, 0.12); g.add(cp);
    applyTex(cp, 'assets/textures/ballroom/ballroom_curtain_velvet_1024.webp', 1, 1);
  });
  g.position.set(x, 3.1, z); g.rotation.y = rotY; scene.add(g);
  return g;
}
// North (exit door at 0) / south (entrance door at 0).
addWindow(-8, -13.96, 0); addWindow(8, -13.96, 0);
addWindow(-9, 13.96, Math.PI); addWindow(9, 13.96, Math.PI);
// West / east (bar sits at x 17.5, z 4..8 — no window there).
addWindow(-19.96, -7, Math.PI / 2); addWindow(-19.96, 0, Math.PI / 2); addWindow(-19.96, 7, Math.PI / 2);
addWindow(19.96, -7, -Math.PI / 2); addWindow(19.96, 0, -Math.PI / 2); addWindow(19.96, 11, -Math.PI / 2);
// South balcony window glass + curtains (2026-11-11, ported from
// ballroom-handoff.html): the 4 m wide balcony window (x -2..2, y 7..9.5,
// south wall). Handoff shows the exterior facade through this opening;

// other windows. Dark-brass rod above it and two velvet panels flanking

const balcGlass = new THREE.Mesh(new THREE.PlaneGeometry(4, 2.5), new THREE.MeshStandardMaterial({ map: NIGHT_SKY, emissive: 0x8a9ac0, emissiveMap: NIGHT_SKY, emissiveIntensity: 0.35, roughness: 0.15, metalness: 0.2 }));
balcGlass.position.set(0, 8.25, 14.7); balcGlass.rotation.y = Math.PI; scene.add(balcGlass);
{
  const brass = new THREE.MeshStandardMaterial({ color: 0x8a6b2f, metalness: 0.85, roughness: 0.35 });
  const brod = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 5, 12), brass);
  brod.rotation.z = Math.PI / 2; brod.position.set(0, 9.8, 13.84); scene.add(brod);
  [-1, 1].forEach((s) => {
    const fin = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), brass);
    fin.position.set(s * 2.5, 9.8, 13.84); scene.add(fin);
    const cp = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 3.8), new THREE.MeshStandardMaterial({ color: 0x5a1a2a }));
    cp.position.set(s * 2.3, 7.9, 13.84); cp.rotation.y = Math.PI; scene.add(cp);
    applyTex(cp, 'assets/textures/ballroom/ballroom_curtain_velvet_1024.webp', 1, 1);
  });
}

// ---- Gilded paintings (AI-generated, 2026-11-13) ----
// Real AI-generated oil paintings replace the procedural canvas portraits
// (2026-11-07). Five images, one per painting; the frames, sizes and
// placements below are unchanged.
function loadPainting(path) {
  const tex = texLoader.load(path);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const PAINTING_TEXTURES = [

// ---- Cat chase + treats + Margo reveal ----
// Taming loop, all three cats: a cat runs from point to point away from
// you. At each stop, press E / USE once to give it a treat — it stays put
// for a few seconds — then tap USE again to photograph its collar. If you
// wait too long after the treat, it runs to the next point and you have
// to give it another treat to try again. Treats are unlimited; there is
// no treat pickup or inventory to manage.
function setTreat(cat, on) {
  if (!cat.group) return;
  if (!cat.treatMesh) {
    cat.treatMesh = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), new THREE.MeshStandardMaterial({ color: 0x8a5a2e }));
    cat.treatMesh.position.set(0, 0.03, 0.26); cat.group.add(cat.treatMesh);

}
function fleeCat(cat) {
  cat.fed = false; cat.fedTimer = 0; setTreat(cat, false);

// Margo is hidden until both easy cats are caught. She then appears at one
// of a few hiding places, with a trail of wet paw marks from Donald's spill
// puddle leading to her — follow the prints to find her.
let margoRevealed = false, trailGroup = null;
function revealMargo() {
  if (margoRevealed) return;
  const margo = CATS.find(c => c.name === 'Margo'); if (!margo) return;
  const spots = [[18.8, 6], [-18, -11], [-17, 12]]; // behind bar, NW corner, SW corner
  const spot = spots[Math.floor(Math.random() * spots.length)];
  margo.group.position.set(spot[0], 0, spot[1]);
  margo.wps = [[spot[0], spot[1]]]; margo.wp = 0; margo.hiding = true; margo.hidden = false;
  margo.group.visible = true; margoRevealed = true;
  if (trailGroup) { scene.remove(trailGroup); trailGroup = null; }
  trailGroup = new THREE.Group();
  const dx = spot[0] - PUDDLE.x, dz = spot[1] - PUDDLE.z, dist = Math.hypot(dx, dz);
  const steps = Math.max(2, Math.floor(dist / 1.25));
  const px = -dz / dist, pz = dx / dist; // perpendicular, for alternating paws
  for (let i = 1; i <= steps; i++) {
    const f = i / steps, side = (i % 2 === 0 ? 1 : -1) * 0.18;
    const print = new THREE.Mesh(new THREE.CircleGeometry(0.12, 12), new THREE.MeshStandardMaterial({ color: 0x1a2a33, transparent: true, opacity: 0.7 }));
    print.rotation.x = -Math.PI / 2;

function nearestTalk() {

  if (missionStage === 'intro') {
    introIdx++;

  }

// ---- Loop ----
const clock = new THREE.Clock();
// Spiral-stair + balcony heights (2026-11-06, ported from ballroom-handoff.html):
// on the stairs, y follows the helix (0.4 m per step, 24 deg per step);
// on a balcony/walkway/room rectangle, y=6; everywhere else, y=0.
// The balcony rectangles are BALC (north) + BALC2 (south + strips + east
// walkway) — the rooms sit inside those rectangles, so they are walkable.
const stairOn = { on: false, prevTheta: 0 };
function stairAngleDeg(p) { return Math.atan2(p.z - STAIR_C.z, p.x - STAIR_C.x) * 180 / Math.PI; }
function wrap180(a) { while (a > 180) a -= 360; while (a < -180) a += 360; return a; }
function stairBalconyY(p) {
  if (p.x >= BALC.x0 && p.x <= BALC.x1 && p.z >= BALC.z0 && p.z <= BALC.z1) { stairOn.on = false; return STAIR_TOP; }
  for (const r of BALC2) if (p.x >= r.x0 && p.x <= r.x1 && p.z >= r.z0 && p.z <= r.z1) { stairOn.on = false; return STAIR_TOP; }
  const dx = p.x - STAIR_C.x, dz = p.z - STAIR_C.z, r = Math.hypot(dx, dz);
  if (r > 0.4 && r < STAIR_R_OUT + 0.7) {
    let th = stairAngleDeg(p), d = 0;
    if (stairOn.on) d = wrap180(th - stairOn.prevTheta);
    else if (Math.abs(wrap180(th - 180)) < 60) { stairOn.on = true; d = 0; }
    stairOn.prevTheta = th;
    if (stairOn.on) { const step = (wrap180(th - 180) + 360) % 360; return Math.min(Math.max(step / 24 * 0.4, 0), STAIR_TOP); }
  }
  stairOn.on = false; return 0;
}
// ---- Idle-orbit cinematic camera ----
// When the player stands still for 2 s, the camera slowly orbits them
// (one full turn every ~24 s), breathing in and out (4-6 m) and drifting
// in height (1.5-3 m), to show the character model from the front and
// sides. Any move or action returns the normal camera immediately.
// Mouse look alone does not reset it (the character is still standing).
const IDLE_ORBIT_DELAY = 10;
const IDLE_ORBIT_PERIOD = 24;
let idleT = 0, orbitActive = false, orbitT = 0, orbitAngle = 0;
let idleLastX = null, idleLastZ = null;
function noteActivity() { idleT = 0; orbitActive = false; }
// Any input resets the idle timer — not just game actions. Touchscreen
// (touch/pointer), keyboard, and mouse (pointer/wheel) all count, so the
// orbit only starts after IDLE_ORBIT_DELAY of no input of any kind.
['pointerdown', 'pointermove', 'wheel', 'touchstart', 'touchmove', 'keydown'].forEach(ev =>
  addEventListener(ev, noteActivity, { passive: true }));
function idleOrbitActive(dt, canOrbit) {
  // True when the orbit camera should drive this frame. canOrbit is the
  // page's normal-gameplay guard (started, not won, not in a cinematic
  // or the escape cinematic); when false the timer resets and it returns
  // false.
  if (!canOrbit) { idleT = 0; orbitActive = false; return false; }
  const px = player.position.x, pz = player.position.z;
  if (idleLastX === null) { idleLastX = px; idleLastZ = pz; }
  if (Math.hypot(px - idleLastX, pz - idleLastZ) > 0.001) {
    idleT = 0; orbitActive = false; idleLastX = px; idleLastZ = pz;
    return false;
  }
  idleLastX = px; idleLastZ = pz;
  idleT += dt;
  if (idleT < IDLE_ORBIT_DELAY) return false;
  if (!orbitActive) {
    orbitActive = true; orbitT = 0;
    // Start from the current camera direction so there is no snap.
    orbitAngle = Math.atan2(camera.position.x - px, camera.position.z - pz);
  }
  orbitT += dt;
  return true;
}
function orbitCamPos(out) {
  const ang = orbitAngle + orbitT * (Math.PI * 2 / IDLE_ORBIT_PERIOD);
  const dist = 5 + Math.sin(orbitT * 0.5);
  const h = 2.25 + Math.sin(orbitT * 0.33) * 0.75;
  out.set(
    player.position.x + Math.sin(ang) * dist,
    player.position.y + h,
    player.position.z + Math.cos(ang) * dist
  );
  return out;
}

// Camera occlusion (same pattern as theater.html): a wall between the
// camera and the player must not render, or it blocks the view of the
// player. Each frame, raycast from the camera to the player's chest;
// any wall the ray hits is hidden until the ray no longer hits it.
// Render-only: the walls stay in the scene (collision untouched), and
// the raycaster intersects meshes regardless of visibility.
// Occluders: the four ground-floor hall walls, the five upper walls,
// the second-story bedroom/bathroom walls, and the staircase column.
// The balcony floors, ceiling, railings, trim, windows and furniture
// are NOT occluders (the floors/ceiling never sit on the camera ray;
// the rest are too thin or too low to block it).
const BALLROOM_WALLS = [...walls, ...upperWalls, b1sA, b1sB, b1sL, b1w, b2sA, b2sB, b2sL, b2e, bPart, baN, baW, baEA, baEB, baEL, stairCol];
const camRay = new THREE.Raycaster();
const _camDir = new THREE.Vector3();
const _chest = new THREE.Vector3();
function updateWallOcclusion() {
  _chest.set(player.position.x, player.position.y + 1.6, player.position.z);
  _camDir.copy(_chest).sub(camera.position);
  const dist = _camDir.length();
  if (dist < 0.01) { for (const w of BALLROOM_WALLS) w.visible = true; return; }
  _camDir.normalize();
  camRay.set(camera.position, _camDir);
  camRay.far = dist;
  const hits = camRay.intersectObjects(BALLROOM_WALLS, false);
  const hit = new Set(hits.map(h => h.object));
  for (const w of BALLROOM_WALLS) w.visible = !hit.has(w);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); const t = clock.elapsedTime;
  if (cinematic) {
    cinematic.t += dt;
    const c = cinematic, ph = c.t / c.dur;
    const ease = (x) => x * x * (3 - 2 * x);
    if (ph >= 1) endCinematic();
  }
  if (missionStage === 'waiting' && photoIdx < 3 && clock.elapsedTime >= nextCineAt && nextCineAt > 0) {
    nextCineAt = 0; startCinematic(photoIdx);
  }
  // Photo window has no countdown: it stays open until you take the photo.
  // (windowTimer is no longer counted down, and closeWindow is not auto-called.)
  if (escapeCine) { escapeCine.t += dt; updateEscapeCine(dt); if (escapeCine.t >= escapeCine.dur) endEscapeCinematic(); }
  if (escapePending && lamboGroup) { escapePending = false; startEscapeCinematic(); }
  if (started && !won && !cinematic && !escapeCine) {
    let fx = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
    let fz = (keys['w'] ? 1 : 0) - (keys['s'] ? 1 : 0);
    if (joyId !== null) { fx += joyX; fz += -joyY; }
    const ml = Math.hypot(fx, fz);
    if (ml > 1) { fx /= ml; fz /= ml; }
    // Camera-forward movement (same fix as the courtyard game: forward = -sin/-cos)
    const dx = fx * Math.cos(yaw) - fz * Math.sin(yaw);
    const dz = -fx * Math.sin(yaw) - fz * Math.cos(yaw);
    const speed = (keys['shift'] ? 5.5 : 4) * dt;
    player.position.x += dx * speed; player.position.z += dz * speed;
    player.position.x = Math.max(-HALL_X + 1, Math.min(HALL_X - 1, player.position.x));
    player.position.z = Math.max(-HALL_Z + 1, Math.min(HALL_Z - 1, player.position.z));
    player.position.y = stairBalconyY(player.position) + CHAR_LIFT;
    for (const c of colliders) {
      if (c.y !== undefined && player.position.y - CHAR_LIFT !== c.y) continue; // ground-floor-only collider, player is on the other floor
      if (c.yMin !== undefined && player.position.y - CHAR_LIFT < c.yMin) continue; // railing/wall collider, player is below the balcony
      const ddx = player.position.x - c.x, ddz = player.position.z - c.z, d = Math.hypot(ddx, ddz);
      if (d < c.r && d > 0.01) { player.position.x = c.x + ddx / d * c.r; player.position.z = c.z + ddz / d * c.r; }
    }
    player.rotation.y = yaw;

    // Left/Right clip plays below while it lasts.

    prevYawTurn = yaw;
    turnDir = _yd > 0.01 ? 1 : (_yd < -0.01 ? -1 : 0);
    if (mixer) {
      mixer.update(dt);
      if (talking) { idleTimer = 4 + Math.random() * 2; idleVarKey = null; }
      else if (turnDir !== 0 && ml <= 0.1) { idleTimer = 4 + Math.random() * 2; idleVarKey = null; playClip(turnDir > 0 ? 'turnLeft' : 'turnRight'); }
      else if (ml > 0.1) { idleTimer = 4 + Math.random() * 2; idleVarKey = null; playClip(moveClipKey(fx, fz, ml)); }
      else if (idleVarKey) { if (t >= idleVarEnd) { idleVarKey = null; playClip('idle'); } }
      else {
        idleTimer -= dt;
        if (idleTimer <= 0) {
          const k = IDLE_VARS[Math.floor(Math.random() * IDLE_VARS.length)];
          if (mxClips[k] && playMxClipOnce(k)) { idleVarKey = k; idleVarEnd = t + mxClips[k].duration; }
          idleTimer = 4 + Math.random() * 2;
        } else playClip('idle');
      }
    }
    // Guest/contact bone animation: talk while talking, walk while moving, else idle.
    for (const n of NPCS) {
      if (!n.mixer || n.role === 'cat') continue;
      n.mixer.update(dt);
      if (talking === n) playGuestClip(n, 'talk');
      else if (n.role === 'donald' && n.falling > 0) playMxCharClipOnce(n, 'falling');
      else if (n.role === 'donald' && n.moving) playGuestClip(n, 'drunkStumble');
      else if (n.role === 'donald') playGuestClip(n, 'drunkIdle');
      else if (n.moving) playGuestClip(n, 'walk');
      else playGuestClip(n, 'idle');
    }
    // Prompt / exit proximity
    let best = null, bd = 3.2;
    for (const n of NPCS) { if (!n.group.visible) continue; const d = n.group.position.distanceTo(player.position); if (d < bd) { bd = d; best = n; } }
    const prompt = document.getElementById('prompt');
    // The prompt element was removed with the HUD text, so prompt is null:
    // only end a conversation when nobody is nearby, not on every frame.
    // (Without this, dialogue closed one frame after opening.)
    if (best) { if (prompt) { prompt.textContent = (best.role === 'cat' ? (best.fed ? 'Photograph ' + best.name + '\'s collar' : 'Give ' + best.name + ' a treat') : 'Talk to ' + best.name) + ' — tap USE'; prompt.style.display = 'block'; } }
    else if (Math.hypot(player.position.x, player.position.z + HALL_Z) < 2.5) {
      if (prompt) { prompt.textContent = photos.length === 3 ? 'North exit open — tap USE to leave' : 'North exit is locked — photograph all 3 collars first (moon, note, rose)'; prompt.style.display = 'block'; }
    } else { if (prompt) prompt.style.display = 'none'; if (talking) endTalk(); }
    updatePlayFight(dt);

    for (const n of NPCS) {
      if (n === talking) continue;
      if (n.role === 'cat' && (n.name === 'Moxie' || n.name === 'Mabel') && playFight.active && !n.fleeing && !n.fed) continue; // play fight moves these cats, not the wander loop
      if (windowOpen && n.role !== 'cat') {
        // Everybody's back is turned: dancing, at the bar, or checking on
        // Donald. Nobody is watching Rochelle or the cat.
        n.group.rotation.y = Math.atan2(n.group.position.x - player.position.x, n.group.position.z - player.position.z);
        n.moving = false; continue;
      }
      if (!n.group.visible) continue; // hidden Margo: not in the hall yet
      if (n.role === 'donald') {
        // Stumble walk: slow, wobbling, and every so often he falls down
        // flat for a couple of seconds, drink still in hand, then gets up.
        if (n.falling > 0) { n.falling -= dt; n.moving = false; if (n.falling <= 0) { n.fallTimer = 14 + Math.random() * 14; } continue; }
        n.fallTimer -= dt; if (n.fallTimer <= 0) { n.falling = 3.5; continue; }

  if (idleOrbitActive(dt, started && !won && !cinematic && !escapeCine)) {

  }

  if (flashT >= 0) {

    if (fl) fl.style.opacity = String(0.85 * (1 - k));
    if (slrFlashFaceMat) slrFlashFaceMat.emissiveIntensity = 0.25 + 6 * (1 - k);
    if (k >= 1) { flashT = -1; if (fl) fl.style.opacity = '0'; }
  }

  renderer.render(scene, camera);
}

    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r * lr, 1), mat);

}

// White Lambo (the only real vehicle model in the project), parked

// Kyle, the second escape agent: the same Mixamo FBX the old ballroom

const ESC_ROOF = { Moxie: [0.35, 1.3], Mabel: [-0.35, 0.1], Margo: [0, -1.2] };
const ESC_GROUND = { Moxie: [8.8, 34.5], Mabel: [13.2, 34.5], Margo: [11, 36.5] };
function startEscapeCinematic() {

  windowOpen = false; windowTimer = 0;

function updateEscapeCine(dt) {

  for (const cat of CATS) { if (cat.mixer) cat.mixer.update(dt); }
  // Camera: pan to the drive, hold on the gather, then track the car.
  if (e.t < 2) {
    const k = ease(e.t / 2);
    e.camPos.copy(lerp3(e.fromPos, e.drivePos, k));
    e.camLook.copy(lerp3(e.fromLook, e.driveLook, k));

  if (e.t >= 2 && e.t < 4.5) {

      if (cat._escAttached) continue;
      const p = lerp3(cat._escFrom, cat._escTo, k);
      p.y += Math.sin(k * Math.PI) * 0.6; // hop arc
      cat.group.position.copy(p);

    if (kyleAgent) kyleAgent.group.position.copy(lerp3(kyleAgent._escFrom, kyleAgent._escDoor, k));
    player.position.copy(lerp3(e.rochFrom, e.rochDoor, k));

  if (e.t >= 4.5) {
    for (const cat of CATS) {
      if (!cat._escAttached) { cat.group.position.copy(cat._escTo); lamboGroup.attach(cat.group); cat._escAttached = true; }
    }

    const k = ease((e.t - 4.5) / 1.5);
    if (kyleAgent && !kyleAgent._escAttached) kyleAgent.group.position.copy(lerp3(kyleAgent._escDoor, kyleAgent._escSeat, k));
    if (!e.rochAttached) player.position.copy(lerp3(e.rochDoor, e.rochSeat, k));
  }
  if (e.t >= 6) {
    if (kyleAgent && !kyleAgent._escAttached) { kyleAgent.group.position.copy(kyleAgent._escSeat); lamboGroup.attach(kyleAgent.group); kyleAgent._escAttached = true; }

      e.camLook.copy(lerp3(e.driveLook, trackLook, k));

}
