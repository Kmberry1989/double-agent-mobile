<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// Human characters stand 5 cm off the floor (feet less likely to clip
// into / sink below it). Added to every human character's standing Y:
// player spawn + teleport, guest spawn, guest idle bob (cats are NOT
// lifted — they sit/lie on the floor).
const CHAR_LIFT = 0.05;
const gltfLoader = new GLTFLoader();
// Draco decoder: most GLBs in this repo are Draco-compressed (white_lambo, weapons, ballroom props, cats).
// Without this, GLTFLoader throws 'No DRACOLoader instance provided' and the model silently fails to load.
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
gltfLoader.setDRACOLoader(dracoLoader);
// GLB prop helper: fit a loaded model to target W/H/D (non-uniform, so it
// matches the footprint it replaces), centre it in a group, and return the
// group. The caller places the group: base-anchored props sit at y = targetH/2
// (so the model base is on the floor), centre-anchored props at the centre.
// If a GLB fails to load, the caller keeps its procedural mesh — nothing
// disappears, the room just keeps its old look.
function fitPropGroup(obj, targetW, targetH, targetD){
  obj.traverse((o)=>{ if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  let bb = new THREE.Box3().setFromObject(obj); const size = new THREE.Vector3(); bb.getSize(size);
  if (!size.x || !size.y || !size.z) return null;
  obj.scale.set(targetW / size.x, targetH / size.y, targetD / size.z);
  bb = new THREE.Box3().setFromObject(obj); const c = new THREE.Vector3(); bb.getCenter(c);
  obj.position.set(-c.x, -c.y, -c.z);
  const g = new THREE.Group(); g.add(obj); return g;
}
function loadProp(path, x, y, z, targetW, targetH, targetD, rotY, hide){
  gltfLoader.load(path, (gltf)=>{
    const g = fitPropGroup(gltf.scene, targetW, targetH, targetD); if (!g) return;
    g.position.set(x, y, z); if (rotY) g.rotation.y = rotY; scene.add(g);
    (hide || []).forEach((m)=>{ if (m) m.visible = false; });
  }, undefined, ()=>{ /* keep procedural fallback */ });
}

const HALL_X = 20, HALL_Z = 14;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x201409);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
scene.add(new THREE.AmbientLight(0xffe6b0, 0.85));
scene.add(new THREE.HemisphereLight(0xffe6b0, 0x3a2410, 0.6));
// Ballroom textures (user uploads, assets/textures/): flat colour stays
// until the texture arrives, and stays forever if it fails to load.
const texLoader = new THREE.TextureLoader();
function applyTex(mesh, path, rx, ry){
  texLoader.load(path, (tex)=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(rx, ry); tex.colorSpace = THREE.SRGBColorSpace;
    mesh.material.map = tex; mesh.material.color.setHex(0xffffff); mesh.material.needsUpdate = true;
  }, undefined, ()=>{});
}
function applyTexToGroup(group, path){
  texLoader.load(path, (tex)=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(1, 1); tex.colorSpace = THREE.SRGBColorSpace;
    group.traverse((o)=>{ if (o.isMesh){ o.material.map = tex; o.material.color.setHex(0xffffff); o.material.needsUpdate = true; } });
  }, undefined, ()=>{});
}
function flatPlane(x, y, z, w, d, color, path, rx, ry, rotX){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color }));
  m.rotation.x = rotX === undefined ? -Math.PI / 2 : rotX; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m);
  if (path) applyTex(m, path, rx, ry); return m;
}

// ---- Ballroom ----
function box(x, y, z, w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color }));
  m.position.set(x, y, z); scene.add(m); return m;
}
function cyl(x, y, z, rTop, rBot, h, color) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 24), new THREE.MeshStandardMaterial({ color }));
  m.position.set(x, y, z); scene.add(m); return m;
}
// Floor + dance floor + walls, with the new ballroom textures.
const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALL_X * 2, HALL_Z * 2), new THREE.MeshStandardMaterial({ color: 0x6b4a26 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
applyTex(floor, 'assets/textures/ballroom/ballroom_floor_polished_wood_honey_brown_1024.webp', 8, 6);
const dance = new THREE.Mesh(new THREE.PlaneGeometry(13, 9), new THREE.MeshStandardMaterial({ color: 0x8a5a2e }));
dance.rotation.x = -Math.PI / 2; dance.position.set(0, 0.02, -1); scene.add(dance);
applyTex(dance, 'assets/textures/ballroom/ballroom_floor_herringbone_marble_border_1024.webp', 1, 1);
const walls = [
  box(0, 3, -HALL_Z - 0.5, HALL_X * 2 + 2, 6, 1, 0x5a2f22), // north wall
  box(0, 3, HALL_Z + 0.5, HALL_X * 2 + 2, 6, 1, 0x5a2f22), // south wall (entrance side)
  box(-HALL_X - 0.5, 3, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22),
  box(HALL_X + 0.5, 3, 0, 1, 6, HALL_Z * 2 + 2, 0x5a2f22),
];
walls.forEach((w)=>applyTex(w, 'assets/textures/ballroom/ballroom_wall_damask_burgundy_gold_1024.webp', 8, 2));
// Wood wainscoting strip along the lower walls (player clamp is ±19/±13,
// the strips sit at ±19.82/±13.82, so they are never walked into).
[[0, -13.82, 40, 0.2], [0, 13.82, 40, 0.2], [-19.82, 0, 0.2, 28], [19.82, 0, 0.2, 28]].forEach(([x, z, w, d])=>{
  const m = box(x, 0.6, z, w, 1.2, d, 0x3a2410);
  // Square tiles: the wainscoting texture is a 4x4 panel grid, so repeat
  // the long dimension in 1.2 m tiles (each tile 1.2x1.2 m, each panel
  // 0.3 m square). The old repeat (8,1) stretched the panels ~4:1 wide.
  applyTex(m, 'assets/textures/ballroom/ballroom_wall_wood_wainscoting_dark_1024.webp', Math.max(w, d) / 1.2, 1);
});
// Ceiling (was open) with plaster/moulding.
flatPlane(0, 5.95, 0, HALL_X * 2, HALL_Z * 2, 0xe8ddc8, 'assets/textures/ballroom/ballroom_ceiling_plaster_moulding_1024.webp', 6, 4, Math.PI / 2);
// Wall trim (2026-11-11): thin solid-color strips along the walls — crown
// molding below the ceiling, baseboard at the floor, chair rail capping
// the wainscoting. Each strip sits proud of the face behind it (its back
// face at least 0.01 m in front of that face) so no trim face is coplanar
// with a wall or wainscoting face. inset = how far the back face sits in
// front of the wall face (0.01 = just proud of the bare wall; 0.29 = just
// proud of the wainscoting, whose room face is 0.28 in front of the wall).
function addTrim(y, h, d, color, inset) {
  box(0, y, -HALL_Z + inset + d / 2, HALL_X * 2, h, d, color); // north
  box(0, y, HALL_Z - inset - d / 2, HALL_X * 2, h, d, color); // south
  box(-HALL_X + inset + d / 2, y, 0, d, h, HALL_Z * 2, color); // west
  box(HALL_X - inset - d / 2, y, 0, d, h, HALL_Z * 2, color); // east
}
addTrim(5.85, 0.15, 0.14, 0xe8ddc8, 0.01); // crown molding, cream, just below the ceiling
addTrim(0.1, 0.2, 0.08, 0x3a2410, 0.29); // baseboard, dark wood, proud of the wainscoting
addTrim(1.2, 0.08, 0.08, 0x3a2410, 0.29); // chair rail, dark wood, capping the wainscoting

// ---- Interior windows + curtain rods (night ball, 2026-11-07) ----
// Tall white-framed windows on the interior walls, night sky behind the
// glass (it is a nighttime ball and the walls are solid). Dark-brass rods
// above them with velvet curtains pulled to the sides of each window.
// Placed on real wall faces (interior faces at z +/-14, x +/-20), clear
// of the doors, the bar, and the tables.
function nightSkyTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 384;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 384);
  grad.addColorStop(0, '#05081f'); grad.addColorStop(0.55, '#0d1740'); grad.addColorStop(1, '#1c2547');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 384);
  for (let i = 0; i < 80; i++) {
    g.fillStyle = 'rgba(255,255,255,' + (0.25 + Math.random() * 0.75).toFixed(2) + ')';
    const s = Math.random() * 1.6 + 0.6;
    g.fillRect(Math.random() * 256, Math.random() * 250, s, s);
  }
  const glow = g.createRadialGradient(192, 72, 4, 192, 72, 78);
  glow.addColorStop(0, 'rgba(255,244,200,0.9)');
  glow.addColorStop(0.35, 'rgba(255,244,200,0.22)');
  glow.addColorStop(1, 'rgba(255,244,200,0)');
  g.fillStyle = glow; g.fillRect(104, 0, 152, 160);
  g.fillStyle = '#fdf6d8'; g.beginPath(); g.arc(192, 72, 20, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(190,180,140,0.55)';
  g.beginPath(); g.arc(186, 66, 4, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(198, 78, 3, 0, Math.PI * 2); g.fill();
  // Distant rooftops along the bottom, a few lit windows.
  g.fillStyle = '#04060e';
  g.beginPath(); g.moveTo(0, 384); g.lineTo(0, 320); g.lineTo(40, 296); g.lineTo(80, 320); g.lineTo(120, 300); g.lineTo(170, 324); g.lineTo(210, 302); g.lineTo(256, 322); g.lineTo(256, 384); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,214,120,0.9)';
  g.fillRect(52, 312, 5, 7); g.fillRect(140, 316, 5, 7); g.fillRect(200, 312, 5, 7);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}
const NIGHT_SKY = nightSkyTexture();
function addWindow(x, z, rotY) {
  // Group local +Z faces into the room. 1.7 m wide x 3.4 m tall, centre
  // y 3.1 (above the 1.2 m wainscoting, below the 6 m ceiling).
  const g = new THREE.Group();
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xf5efe0, roughness: 0.6 });
  const W = 1.7, H = 3.4;
  const rail = (w, h, px, py) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), frameMat); m.position.set(px, py, 0); m.castShadow = true; g.add(m); return m; };
  rail(W, 0.09, 0, H / 2 - 0.045); rail(W, 0.09, 0, -H / 2 + 0.045);
  rail(0.09, H, -W / 2 + 0.045, 0); rail(0.09, H, W / 2 - 0.045, 0);
  const sill = new THREE.Mesh(new THREE.BoxGeometry(W + 0.16, 0.07, 0.14), frameMat);
  sill.position.set(0, -H / 2 - 0.035, 0.03); g.add(sill);
  // Night-sky glass, faintly glowing so it reads at night.
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.18, H - 0.18), new THREE.MeshStandardMaterial({ map: NIGHT_SKY, emissive: 0x8a9ac0, emissiveMap: NIGHT_SKY, emissiveIntensity: 0.35, roughness: 0.15, metalness: 0.2 }));
  glass.position.set(0, 0, -0.01); g.add(glass);
  // Mullions: one vertical, two horizontal.
  const mv = new THREE.Mesh(new THREE.BoxGeometry(0.05, H - 0.18, 0.03), frameMat); mv.position.set(0, 0, 0.01); g.add(mv);
  [-H / 6, H / 6].forEach((py) => { const mh = new THREE.Mesh(new THREE.BoxGeometry(W - 0.18, 0.05, 0.03), frameMat); mh.position.set(0, py, 0.01); g.add(mh); });
  // Curtain rod above: dark brass, finials, two brackets. Velvet curtains
  // hang from the rod, pulled to the sides of the window — flanking the
  // glass, never covering it. Panel top at the rod, bottom at the
  // wainscoting top (world y 1.2).
  const brass = new THREE.MeshStandardMaterial({ color: 0x8a6b2f, metalness: 0.85, roughness: 0.35 });
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, W + 0.5, 12), brass);
  rod.rotation.z = Math.PI / 2; rod.position.set(0, H / 2 + 0.32, 0.12); g.add(rod);
  [-1, 1].forEach((s) => {
    const fin = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), brass);
    fin.position.set(s * (W / 2 + 0.25), H / 2 + 0.32, 0.12); g.add(fin);
    const br = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.1, 0.12), brass);
    br.position.set(s * (W / 2 - 0.1), H / 2 + 0.32, 0.06); g.add(br);
    const cp = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 3.9), new THREE.MeshStandardMaterial({ color: 0x5a1a2a }));
    cp.position.set(s * (W / 2 + 0.28), 0.06, 0.12); g.add(cp);
    applyTex(cp, 'assets/textures/ballroom/ballroom_curtain_velvet_1024.webp', 1, 1);
  });
  g.position.set(x, 3.1, z); g.rotation.y = rotY; scene.add(g);
  return g;
}
// North (exit door at 0) / south (entrance door at 0).
addWindow(-8, -13.96, 0); addWindow(8, -13.96, 0);
addWindow(-9, 13.96, Math.PI); addWindow(9, 13.96, Math.PI);
// West / east (bar sits at x 17.5, z 4..8 — no window there).
addWindow(-19.96, -7, Math.PI / 2); addWindow(-19.96, 0, Math.PI / 2); addWindow(-19.96, 7, Math.PI / 2);
addWindow(19.96, -7, -Math.PI / 2); addWindow(19.96, 0, -Math.PI / 2); addWindow(19.96, 11, -Math.PI / 2);

// ---- Gilded paintings (2026-11-07) ----
// No portrait/painting image exists under assets/ — these canvases are
// painted procedurally (classical portraits, a moonlit garden, roses, a
// ball scene) in a muted burgundy/gold/cream palette. If the user sends
// real paintings, swap the canvas textures for them.
function paintCanvas(draw) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 320;
  const g = c.getContext('2d'); draw(g);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}
const PAINTING_TEXTURES = [
  paintCanvas((g) => { // Lady in gold — portrait
    g.fillStyle = '#2a1a12'; g.fillRect(0, 0, 256, 320);
    g.fillStyle = '#6a4a1a'; g.beginPath(); g.ellipse(128, 150, 90, 120, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#3a2418'; g.beginPath(); g.ellipse(128, 150, 80, 110, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#7a1a2a'; g.beginPath(); g.moveTo(128, 190); g.lineTo(60, 320); g.lineTo(196, 320); g.closePath(); g.fill();
    g.fillStyle = '#c9a227'; g.fillRect(118, 200, 20, 6);
    g.fillStyle = '#d9a06b'; g.fillRect(120, 150, 16, 40);
    g.beginPath(); g.ellipse(128, 120, 30, 38, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#1a1210'; g.beginPath(); g.ellipse(128, 92, 32, 22, 0, Math.PI, 0); g.fill();
    g.beginPath(); g.arc(128, 82, 12, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#1a1210'; g.fillRect(112, 116, 8, 3); g.fillRect(136, 116, 8, 3);
    g.fillStyle = '#8a3a3a'; g.fillRect(120, 142, 16, 3);
  }),
  paintCanvas((g) => { // Gentleman with moustache — portrait
    g.fillStyle = '#14202a'; g.fillRect(0, 0, 256, 320);
    g.fillStyle = '#3a4a5a'; g.beginPath(); g.ellipse(128, 150, 88, 118, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#1a1a1a'; g.beginPath(); g.moveTo(128, 185); g.lineTo(58, 320); g.lineTo(198, 320); g.closePath(); g.fill();
    g.fillStyle = '#f0ead8'; g.beginPath(); g.moveTo(128, 185); g.lineTo(112, 205); g.lineTo(128, 225); g.lineTo(144, 205); g.closePath(); g.fill();
    g.fillStyle = '#c98a5a'; g.fillRect(120, 150, 16, 38);
    g.beginPath(); g.ellipse(128, 120, 30, 38, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#8a8a8a'; g.beginPath(); g.ellipse(128, 90, 31, 18, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#2a2a2a'; g.fillRect(112, 116, 8, 3); g.fillRect(136, 116, 8, 3);
    g.fillRect(118, 136, 20, 4);
    g.fillStyle = '#8a3a3a'; g.fillRect(121, 144, 14, 3);
  }),
  paintCanvas((g) => { // Moonlit garden — landscape
    const grad = g.createLinearGradient(0, 0, 0, 320);
    grad.addColorStop(0, '#060a24'); grad.addColorStop(1, '#0e2a22');
    g.fillStyle = grad; g.fillRect(0, 0, 256, 320);
    g.fillStyle = '#fdf6d8'; g.beginPath(); g.arc(196, 62, 18, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#0a2018';
    g.beginPath(); g.moveTo(30, 320); g.lineTo(30, 180); g.lineTo(70, 130); g.lineTo(110, 180); g.lineTo(110, 320); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(150, 320); g.lineTo(150, 200); g.lineTo(185, 150); g.lineTo(220, 200); g.lineTo(220, 320); g.closePath(); g.fill();
    g.fillStyle = '#1a3a2a'; g.fillRect(0, 280, 256, 40);
    g.fillStyle = '#c9b078'; g.beginPath(); g.moveTo(108, 320); g.lineTo(128, 240); g.lineTo(148, 320); g.closePath(); g.fill();
  }),
  paintCanvas((g) => { // Roses still life
    g.fillStyle = '#241a1a'; g.fillRect(0, 0, 256, 320);

const clock = new THREE.Clock();

    const fl = document.getElementById('flash');
    if (fl) fl.style.opacity = String(0.85 * (1 - k));
    if (slrFlashFaceMat) slrFlashFaceMat.emissiveIntensity = 0.25 + 6 * (1 - k);
    if (k >= 1) { flashT = -1; if (fl) fl.style.opacity = '0'; }
  }
  tryAttachCamera();
  renderer.render(scene, camera);
}

const bushTex = texLoader.load('assets/textures/exterior/exterior_lawn_grass_clover_1024.webp', (tex) => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2, 2); tex.colorSpace = THREE.SRGBColorSpace; });
const BUSH_GREENS = [0x1e4d1e, 0x2a6b2a, 0x3a7d3a, 0x1a421a, 0x2f5e1f];
function bushRand(seed) { const s = Math.sin(seed) * 43758.5453; return s - Math.floor(s); }
function bush(x, z, r) {
  const g = new THREE.Group();
  const variant = Math.floor(bushRand(x * 12.9898 + z * 78.233) * 3); // 0 round, 1 wide, 2 tall
  const lobes = variant === 0
    ? [[0, 0.7, 0, 1.0], [0.5, 0.5, 0.2, 0.65], [-0.45, 0.55, -0.15, 0.6], [0.1, 0.95, -0.3, 0.55], [-0.2, 0.4, 0.45, 0.55]]
    : variant === 1
    ? [[0, 0.55, 0, 0.9], [0.7, 0.45, 0.1, 0.6], [-0.65, 0.5, -0.1, 0.65], [0.2, 0.75, -0.25, 0.5], [-0.3, 0.35, 0.4, 0.5]]
    : [[0, 0.85, 0, 0.9], [0.4, 0.5, 0.15, 0.55], [-0.35, 0.6, -0.2, 0.6], [0.05, 1.25, 0.1, 0.5], [-0.1, 0.35, 0.35, 0.5]];
  lobes.forEach(([lx, ly, lz, lr], i) => {
    const mat = new THREE.MeshStandardMaterial({ color: BUSH_GREENS[i % BUSH_GREENS.length], roughness: 1, flatShading: true, map: bushTex });
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r * lr, 1), mat);
    m.position.set(lx * r, -1.5 + ly * r, lz * r); g.add(m);
  });
  g.position.set(x, 0, z); scene.add(g); return g;
}
function buildEscapeSet() {
  flatPlane(0, -1.5, 42, 80, 70, 0x777777, 'assets/textures/exterior/exterior_lawn_grass_clover_1024.webp', 8, 7);
  cyl(0, -1.48, 32, 13, 13, 0.1, 0x333333);
  flatPlane(0, -1.43, 32, 26, 26, 0x333333, 'assets/textures/exterior/exterior_drive_asphalt_1024.webp', 4, 4);
  cyl(0, -1.47, 32, 5, 5, 0.2, 0x333333);
  box(0, -1.48, 60, 8, 0.1, 30, 0x333333);
  flatPlane(0, -1.43, 60, 8, 30, 0x222222, 'assets/textures/exterior/exterior_drive_asphalt_1024.webp', 2, 4);
  for (let a = 0; a < 360; a += 20) {
    const r = 13.5, x = Math.cos(a * Math.PI / 180) * r, z = 32 + Math.sin(a * Math.PI / 180) * r;
    bush(x, z, 0.9);
  }
  for (let x = -14; x <= 14; x += 2) bush(x, 16.5, 0.9);
  for (let a = 0; a < 360; a += 45) bush(Math.cos(a * Math.PI / 180) * 3.5, 32 + Math.sin(a * Math.PI / 180) * 3.5, 0.6);
}
buildEscapeSet();
// White Lambo (the only real vehicle model in the project), parked
// curbside east as in the handoff drive.
gltfLoader.load('assets/vehicles/white_lambo.glb', (gltf) => {
  const g = fitPropGroup(gltf.scene, 2.0, 1.2, 4.5); if (!g) return;
  g.traverse((c) => { if (c.isMesh && c.material && c.material.color && c.material.color.getHex() === 0xffffff) { c.material.metalness = 0; c.material.roughness = 0.55; } });
  g.position.set(11, -0.9, 32); g.rotation.y = 0.4;
  scene.add(g); lamboGroup = g;
});
// Kyle, the second escape agent: the same Mixamo FBX the old ballroom
// used as its player. No basecolor file exists for him, so the FBX's own
// materials apply. He idles on the shared mxClips idle clip.
fbxLoader.load('assets/characters/Kyle_undercover.fbx', (o) => {
  fitCharacter(o, 1.8);
  o.rotation.y = Math.PI;
  const grp = new THREE.Group();
  grp.add(o);
  grp.visible = false; grp.position.set(0, -1.5, 60);
  scene.add(grp);
  kyleAgent = { group: grp, model: o, mixer: new THREE.AnimationMixer(o) };
});
const ESC_ROOF = { Moxie: [0.35, 1.3], Mabel: [-0.35, 0.1], Margo: [0, -1.2] };
const ESC_GROUND = { Moxie: [8.8, 34.5], Mabel: [13.2, 34.5], Margo: [11, 36.5] };
function startEscapeCinematic() {
  if (escapeCine) return;
  if (!lamboGroup) { escapePending = true; missionStage = 'escape'; return; }
  if (talking) endTalk();
  playFight.active = false;
  windowOpen = false; windowTimer = 0;
  missionStage = 'escape';
  const camPos = camera.position.clone();
  const camLook = new THREE.Vector3(player.position.x - Math.sin(yaw) * 3, 1.6, player.position.z - Math.cos(yaw) * 3);
  // Gather everyone on the drive, beside the white Lambo.
  for (const cat of CATS) {
    cat.fleeing = false; cat.fed = false; cat.moving = false; cat.hiding = false; setTreat(cat, false);
    const s = ESC_GROUND[cat.name] || [11, 34];
    cat.group.position.set(s[0], -1.43, s[1]);
    cat.group.rotation.y = 0; // face south, the direction of travel
    cat._escFrom = cat.group.position.clone();
    const r = ESC_ROOF[cat.name] || [0, 0];
    cat._escTo = new THREE.Vector3(11 + r[0], -0.25, 32 + r[1]);
    cat._escAttached = false;
    if (cat.clips && cat.clips.sit) playCatClip(cat, 'sit');
  }
  if (kyleAgent) {
    kyleAgent.group.visible = true;
    kyleAgent.group.position.set(9.2, -1.43, 30.5);
    kyleAgent.group.rotation.y = Math.PI / 2; // face the car (east)
    kyleAgent._escFrom = kyleAgent.group.position.clone();
    kyleAgent._escDoor = new THREE.Vector3(9.7, -1.43, 32.6);
    kyleAgent._escSeat = new THREE.Vector3(10.55, -1.43, 32.6);
    kyleAgent._escAttached = false;
  }
  player.position.set(12.8, -1.43, 30.5);
  player.rotation.y = -Math.PI / 2; // face the car (west)

    t: 0, dur: 12,
    fromPos: camPos, fromLook: camLook,
    drivePos: new THREE.Vector3(5, 1.6, 43), driveLook: new THREE.Vector3(11, -0.6, 32),
    camPos: camPos.clone(), camLook: camLook.clone(),
    carPos: new THREE.Vector3(11, -0.9, 32),
    rochFrom: new THREE.Vector3(12.8, -1.43, 30.5),
    rochDoor: new THREE.Vector3(12.3, -1.43, 32.6),
    rochSeat: new THREE.Vector3(11.45, -1.43, 32.6),

}
function updateEscapeCine(dt) {
  const e = escapeCine; if (!e) return;
  const ease = (x) => x * x * (3 - 2 * x);
  const lerp3 = (a, b, k) => new THREE.Vector3(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k, a.z + (b.z - a.z) * k);
  // Keep everyone alive while the main loop is paused for the cinematic.
  if (mixer) { mixer.update(dt); playClip('idle'); }
  if (kyleAgent && kyleAgent.mixer) { kyleAgent.mixer.update(dt); playMxCharClip(kyleAgent, 'idle'); }
  for (const cat of CATS) { if (cat.mixer) cat.mixer.update(dt); }
  // Camera: pan to the drive, hold on the gather, then track the car.
  if (e.t < 2) {
    const k = ease(e.t / 2);
    e.camPos.copy(lerp3(e.fromPos, e.drivePos, k));
    e.camLook.copy(lerp3(e.fromLook, e.driveLook, k));
    lamboGroup.rotation.y = 0.4 + (0 - 0.4) * k; // parked angle eases to facing south
  } else if (e.t < 6) {
    e.camPos.copy(e.drivePos); e.camLook.copy(e.driveLook);
  }
  // Phase B (2-4.5s): cats hop onto the roof; Kyle and Rochelle walk to the doors.
  if (e.t >= 2 && e.t < 4.5) {
    const k = ease((e.t - 2) / 2.5);
    for (const cat of CATS) {
      if (cat._escAttached) continue;
      const p = lerp3(cat._escFrom, cat._escTo, k);
      p.y += Math.sin(k * Math.PI) * 0.6; // hop arc
      cat.group.position.copy(p);
    }
    if (kyleAgent) kyleAgent.group.position.copy(lerp3(kyleAgent._escFrom, kyleAgent._escDoor, k));
    player.position.copy(lerp3(e.rochFrom, e.rochDoor, k));
  }
  if (e.t >= 4.5) {
    for (const cat of CATS) {
      if (!cat._escAttached) { cat.group.position.copy(cat._escTo); lamboGroup.attach(cat.group); cat._escAttached = true; }
    }
  }
  // Phase C (4.5-6s): Kyle and Rochelle get in.
  if (e.t >= 4.5 && e.t < 6) {
    const k = ease((e.t - 4.5) / 1.5);
    if (kyleAgent && !kyleAgent._escAttached) kyleAgent.group.position.copy(lerp3(kyleAgent._escDoor, kyleAgent._escSeat, k));
    if (!e.rochAttached) player.position.copy(lerp3(e.rochDoor, e.rochSeat, k));
  }
  if (e.t >= 6) {
    if (kyleAgent && !kyleAgent._escAttached) { kyleAgent.group.position.copy(kyleAgent._escSeat); lamboGroup.attach(kyleAgent.group); kyleAgent._escAttached = true; }
    if (!e.rochAttached) { player.position.copy(e.rochSeat); lamboGroup.attach(player); e.rochAttached = true; }
  }
  // Phase D (6-11s): the Lambo pulls out of its spot onto the road and drives south.
  if (e.t >= 6 && e.t < 11) {
    const dk = ease((e.t - 6) / 5);
    let cx, cz;
    if (dk < 0.4) { const s = ease(dk / 0.4); cx = 11 + (0 - 11) * s; cz = 32 + (44 - 32) * s; }
    else { const s = ease((dk - 0.4) / 0.6); cx = 0; cz = 44 + (68 - 44) * s; }
    lamboGroup.position.set(cx, -0.9, cz);
    e.carPos.set(cx, -0.9, cz);
    const trackPos = new THREE.Vector3(cx - 9, 2.8, cz - 7), trackLook = new THREE.Vector3(cx, -0.5, cz);
    if (e.t < 7) {
      const k = ease((e.t - 6) / 1);
      e.camPos.copy(lerp3(e.drivePos, trackPos, k));
      e.camLook.copy(lerp3(e.driveLook, trackLook, k));
    } else {
      e.camPos.copy(trackPos); e.camLook.copy(trackLook);
    }
  }
}
function endEscapeCinematic() {
  escapeCine = null;
  document.getElementById('barTop').style.height = '0';
  document.getElementById('barBottom').style.height = '0';
  won = true;
  document.getElementById('winText').textContent = 'Moon, note, rose. The cats rode out on the white Lambo — Kyle driving, Rochelle riding shotgun, all three cats on the roof.';
  document.getElementById('win').style.display = 'flex';
  updateMissionHUD();
}

  window.__mission = { player, NPCS, CATS, PHOTOS, get photos() { return [...photos]; }, get photoIdx() { return photoIdx; }, get windowOpen() { return windowOpen; }, get missionStage() { return missionStage; }, get cinematic() { return cinematic; }, missionTarget, nearestTalk, startCinematic, updateMissionHUD, get won() { return won; }, get escapeCine() { return escapeCine; }, startEscapeCinematic, get escapeReady() { return !!lamboGroup; }, get kyleAgent() { return kyleAgent; }, get lamboGroup() { return lamboGroup; },
    get cameraAttached() { return cameraAttached; }, fireCameraFlash, get flashCount() { return flashCount; },

}
