<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
const gltfLoader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
gltfLoader.setDRACOLoader(dracoLoader);
const fbxLoader = new FBXLoader();
const texLoader = new THREE.TextureLoader();

// ---- Layout ----
// Stage: x -12..12, z -6..6, top y=0.9. Backstage behind the curtain
// (z -10..-6) and wings (x +-12..14) are at the same 0.9 level, so
// Rochelle walks in from backstage and out through the curtains.
// House floor: y=0, z 6..29.5. The only way between stage and house is
// the centre steps (x -1.5..1.5, z 6..7.5); the stage front face is a
// wall everywhere else (enforced by the ground-height step check).
const STAGE_TOP = 0.9;
function groundHeight(x, z) {
  if (z <= 6 && z >= -10 && Math.abs(x) <= 14) return STAGE_TOP;
  if (z > 6 && z <= 7.5 && Math.abs(x) <= 1.5) {
    if (z <= 6.5) return 0.6;
    if (z <= 7.0) return 0.3;
    return 0.0;
  }
  return 0.0;
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0605);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
const ambient = new THREE.AmbientLight(0xffe6b0, 0.25); // house dark until the cinematic
scene.add(ambient);
scene.add(new THREE.HemisphereLight(0xffe6b0, 0x2a1a10, 0.25));
const houseLight = new THREE.PointLight(0xffc94d, 40, 40); houseLight.position.set(0, 8, 18); scene.add(houseLight);

function applyTex(mesh, path, rx, ry) {
  texLoader.load(path, (tex) => {
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(rx, ry); tex.colorSpace = THREE.SRGBColorSpace;
    mesh.material.map = tex; mesh.material.color.setHex(0xffffff); mesh.material.needsUpdate = true;
  }, undefined, () => {});
}
function flatPlane(x, y, z, w, d, color, path, rx, ry, rotX) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color }));
  m.rotation.x = rotX === undefined ? -Math.PI / 2 : rotX; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m);
  if (path) applyTex(m, path, rx, ry); return m;
}
function box(x, y, z, w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color }));
  m.position.set(x, y, z); scene.add(m); return m;
}
function cyl(x, y, z, rTop, rBot, h, color, seg) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg || 24), new THREE.MeshStandardMaterial({ color }));
  m.position.set(x, y, z); scene.add(m); return m;
}
const TEX = 'assets/textures/theater/';

// ---- Theater environment ----
// House floor (dark) + centre aisle carpet + side floor.
flatPlane(0, 0, 18, 28, 24, 0x241812, null, 0, 0); // house floor slab
flatPlane(0, 0.02, 18, 3, 22, 0x7a1a1a, TEX + 'theater_red_carpet_1024.webp', 1, 8); // centre aisle carpet
// Stage top (wood) + front apron face (gold trim strip along the top edge).
flatPlane(0, STAGE_TOP, 0, 24, 12, 0x6b4a26, TEX + 'theater_stage_wood_floor_1024.webp', 6, 3);
box(0, STAGE_TOP / 2, 6.05, 24, STAGE_TOP, 0.3, 0x3a2410); // stage front face
const apronTrim = box(0, STAGE_TOP + 0.04, 6.0, 24, 0.08, 0.35, 0xc9a227);
applyTex(apronTrim, TEX + 'theater_gold_trim_1024.webp', 12, 1);
box(0, STAGE_TOP / 2, -6.05, 24, STAGE_TOP, 0.3, 0x3a2410); // stage back face
box(-12.05, STAGE_TOP / 2, 0, 0.3, STAGE_TOP, 12, 0x3a2410);
box(12.05, STAGE_TOP / 2, 0, 0.3, STAGE_TOP, 12, 0x3a2410);
// Backstage floor (same level as the stage) + wing floors.
flatPlane(0, STAGE_TOP + 0.01, -8, 24, 4, 0x4a3421, TEX + 'theater_stage_wood_floor_1024.webp', 6, 1);
flatPlane(-13, STAGE_TOP + 0.01, 0, 2, 12, 0x4a3421, TEX + 'theater_stage_wood_floor_1024.webp', 1, 3);
flatPlane(13, STAGE_TOP + 0.01, 0, 2, 12, 0x4a3421, TEX + 'theater_stage_wood_floor_1024.webp', 1, 3);
// Centre steps (3 x 0.3 m) from the stage down to the house floor.
box(0, 0.45, 6.25, 3, 0.3, 0.5, 0x5a3a1a);
box(0, 0.15, 6.75, 3, 0.3, 0.5, 0x5a3a1a);
// House walls (damask) + ceiling (ornate) + backstage back wall.
const wallN = box(0, 5, -10.5, 30, 10, 1, 0x3a1a1a); applyTex(wallN, TEX + 'theater_house_wallpaper_1024.webp', 8, 2);
const wallS = box(0, 5, 30.5, 30, 10, 1, 0x3a1a1a); applyTex(wallS, TEX + 'theater_house_wallpaper_1024.webp', 8, 2);
const wallW = box(-14.5, 5, 10, 1, 10, 42, 0x3a1a1a); applyTex(wallW, TEX + 'theater_house_wallpaper_1024.webp', 10, 2);
const wallE = box(14.5, 5, 10, 1, 10, 42, 0x3a1a1a); applyTex(wallE, TEX + 'theater_house_wallpaper_1024.webp', 10, 2);
flatPlane(0, 10, 10, 28, 40, 0x2a3a3a, TEX + 'theater_ceiling_1024.webp', 6, 8, Math.PI / 2);
// Sconces (glowing fixtures, no extra lights) on the house side walls.
[[-13.9, 10], [-13.9, 18], [-13.9, 26], [13.9, 10], [13.9, 18], [13.9, 26]].forEach(([x, z]) => {
  const s = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.3), new THREE.MeshStandardMaterial({ color: 0xc9a227, emissive: 0xffc94d, emissiveIntensity: 1.0 }));
  s.position.set(x, 3, z); scene.add(s);
});
// Proscenium arch (gold trim): two pillars + top beam framing the stage at z=6.
const pilL = box(-12.4, 4, 6, 0.8, 8, 0.8, 0xc9a227); applyTex(pilL, TEX + 'theater_gold_trim_1024.webp', 1, 4);
const pilR = box(12.4, 4, 6, 0.8, 8, 0.8, 0xc9a227); applyTex(pilR, TEX + 'theater_gold_trim_1024.webp', 1, 4);
const archTop = box(0, 8.2, 6, 25.6, 0.8, 0.8, 0xc9a227); applyTex(archTop, TEX + 'theater_gold_trim_1024.webp', 12, 1);
// Footlights: the real footlights.glb (gold strip with round lamps),
// repeated along the stage front edge. The GLB is 2.12 m wide, so 10
// copies spaced 2.2 m cover the 22 m front. The glowing lamp spheres
// stay (raised to sit above the GLB strip).
const footlightsGroup = new THREE.Group();
footlightsGroup.position.set(0, STAGE_TOP + 0.09, 5.85); scene.add(footlightsGroup);
const footlightsParts = [];
gltfLoader.load('assets/theater/models/footlights.glb', (gltf) => {
  for (let i = 0; i < 10; i++) {
    const c = gltf.scene.clone();
    c.position.set(-9.9 + i * 2.2, 0, 0);
    footlightsGroup.add(c);
    footlightsParts.push(c);
  }
}, undefined, () => {});
const footlightsState = { x: 0, z: 5.85, used: false, smashed: false, parts: footlightsParts };
for (let x = -10; x <= 10; x += 2.5) {
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), new THREE.MeshStandardMaterial({ color: 0xffd97a, emissive: 0xffc94d, emissiveIntensity: 1.6 }));
  lamp.position.set(x, STAGE_TOP + 0.3, 5.85); scene.add(lamp);
}
const footLight = new THREE.PointLight(0xffc94d, 30, 18); footLight.position.set(0, 2, 8); scene.add(footLight);

// Main curtain (opens in the cinematic): two halves, red velvet, hanging
// at z=-5.5 from y=0.9 to y=8. Closed they meet at x=0; open they slide
// to the sides (x=+-10.5). Valance across the top.
const curtainMat = new THREE.MeshStandardMaterial({ color: 0x5a1a2a });
const curtainL = new THREE.Mesh(new THREE.PlaneGeometry(12, 7.1), curtainMat.clone());
curtainL.position.set(-6, STAGE_TOP + 3.55, -5.5); scene.add(curtainL);
applyTex(curtainL, TEX + 'theater_red_velvet_curtain_1024.webp', 3, 2);
const curtainR = new THREE.Mesh(new THREE.PlaneGeometry(12, 7.1), curtainMat.clone());
curtainR.position.set(6, STAGE_TOP + 3.55, -5.5); scene.add(curtainR);
applyTex(curtainR, TEX + 'theater_red_velvet_curtain_1024.webp', 3, 2);
const valance = new THREE.Mesh(new THREE.PlaneGeometry(24, 1.2), new THREE.MeshStandardMaterial({ color: 0x5a1a2a }));
valance.position.set(0, 7.9, -5.4); scene.add(valance);
applyTex(valance, TEX + 'theater_red_velvet_curtain_1024.webp', 6, 1);
// Side curtains (legs) at the stage sides.
[-11, 11].forEach((x) => {
  const leg = new THREE.Mesh(new THREE.PlaneGeometry(2, 7.1), new THREE.MeshStandardMaterial({ color: 0x5a1a2a }));
  leg.position.set(x, STAGE_TOP + 3.55, -4); scene.add(leg);
  applyTex(leg, TEX + 'theater_red_velvet_curtain_1024.webp', 1, 2);
});

// Audience seats: 10 rows (z 10..28), two blocks per row flanking the
// centre aisle. Each block is a seat bench + backrest + armrest dividers,
// seat velvet. The blocks are colliders (the seating area is not walkable;
// the player uses the centre aisle and the side aisles).
const colliders = [];
const seatGroups = []; // holders filled once audience_seats.glb loads
function seatBlock(cx, cz, noCollider, baseY) {
  const g = new THREE.Group();
  g.position.set(cx, baseY || 0, cz); scene.add(g);
  seatGroups.push(g);
  if (!noCollider) colliders.push({ x: cx, z: cz, r: 4.5 });
  return g;
}
for (let z = 10; z <= 28; z += 2) { seatBlock(-6.5, z); seatBlock(6.5, z); }
// Balcony: a raised tier at the back of the house (z 27..30, y=4) with a
// railing and a row of seats, overlooking the stage. Scenery only — the
// balcony seats add no colliders (they sit on the tier, above the player).
box(0, 3.5, 28.5, 26, 1, 3, 0x2a1a12);
const balRail = box(0, 4.6, 27.1, 26, 0.9, 0.15, 0xc9a227); applyTex(balRail, TEX + 'theater_gold_trim_1024.webp', 12, 1);
const balSeatL = seatBlock(-6.5, 29, true, 4);
const balSeatR = seatBlock(6.5, 29, true, 4);
// audience_seats.glb is 1.50 m wide; a 9 m block takes 6 copies side by
// side (spacing 1.50). Origin is centred (min Y -0.22), so each copy sits
// at y=+0.22 above its block's base. Seats are static scenery, NOT
// destructible (enemies rise from them). Loaded once, then cloned.
gltfLoader.load('assets/theater/models/audience_seats.glb', (gltf) => {
  const src = gltf.scene;
  for (const g of seatGroups) {
    for (let i = 0; i < 6; i++) {
      const c = src.clone();
      c.position.set(-3.75 + i * 1.5, 0.22, 0);
      // The GLB's backrest is at local -Z, so unrotated the seats face
      // +Z (the back wall). Turn each seat 180 deg so it faces -Z,
      // toward the stage.
      c.rotation.y = Math.PI;
      g.add(c);
    }
  }
}, undefined, () => {});
// Fly loft: a beam above the stage the rigging hangs from.
box(0, 9.2, 0, 24, 0.4, 0.6, 0x2a1a12);

// Spotlights (the cinematic pair): fixtures mounted in the house at y=8,
// aimed at Rochelle at centre stage. Off until the cinematic turns them
// on, left first.
function makeSpotlight(x) {
  // The real spotlight.glb (dark metal fixture, 0.57 x 0.68 x 0.80 m).
  // Lens axis verified (UV/normal analysis): the lens glass faces the
  // model's local +Z, the back cap -Z. So lookAt (+Z at the target)
  // aims the lens at Rochelle. Aim at her torso (y=1.5), not the floor,
  // so the fixture reads as tilted down toward centre stage, lens on her.
  // The visible beam cone + SpotLight stay as they were.
  const g = new THREE.Group();
  g.position.set(x, 8, 15); scene.add(g);
  g.lookAt(0, 1.5, 0);
  const inner = new THREE.Group(); g.add(inner);
  gltfLoader.load('assets/theater/models/spotlight.glb', (gltf) => {
    inner.add(gltf.scene);
  }, undefined, () => {});
  const cone = new THREE.Mesh(new THREE.ConeGeometry(2.2, 9, 20, 1, true), new THREE.MeshBasicMaterial({ color: 0xfff2c0, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
  cone.position.set(x, 4.2, 7.5); cone.rotation.x = Math.PI / 2 + 0.55; scene.add(cone);
  const spot = new THREE.SpotLight(0xfff2c0, 0, 30, 0.35, 0.4, 1.2);
  spot.position.set(x, 8, 15); spot.target.position.set(0, STAGE_TOP, 0); scene.add(spot); scene.add(spot.target);
  // No separate lens mesh on the GLB (single material), so lens is null;
  // the cinematic guards the lens-glow lines. Smashable: slash near the
  // fixture's floor position (x, 15) to knock it down.
  return { group: g, inner, cone, spot, lens: null, x, z: 15, used: false, falling: false, vy: 0 };
}
const spotL = makeSpotlight(-6), spotR = makeSpotlight(6);

// ---- Sandbag ropes (core environmental weapon) ----
// 4 ropes over the stage, each holding a sandbag just above head height
// (bag centre y=2.9, stage floor 0.9). Slash near a rope to cut it; the
// bag drops straight down and defeats whatever enemy is underneath.
const sandbags = [];
function makeSandbag(x, z) {
  const g = new THREE.Group();
  const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 5.8, 8), new THREE.MeshStandardMaterial({ color: 0x8a6b3a }));
  rope.position.set(0, 6.1, 0); g.add(rope);
  applyTex(rope, TEX + 'theater_rope_1024.webp', 1, 6);
  // The real sandbag.glb (canvas bag + a SHORT rope stub on top, Kyle's
  // pick). Its top (+0.68) meets the long rope's bottom (y=3.2), so the
  // bag origin sits at y=2.52. The long rope is the part Rochelle cuts.
  const bagHolder = new THREE.Group();
  bagHolder.position.set(0, 2.52, 0); g.add(bagHolder);
  const sb = { x, z, group: g, rope, bag: bagHolder, cut: false, falling: false, vy: 0, used: false };
  gltfLoader.load('assets/theater/models/sandbag.glb', (gltf) => {
    bagHolder.add(gltf.scene);
    // If the rope was already cut before the model loaded, rest it on the floor.
    if (sb.cut) bagHolder.position.y = 1.2;
  }, undefined, () => {});
  g.position.set(x, 0, z); scene.add(g);
  sandbags.push(sb); return sb;
}
makeSandbag(-6, -2); makeSandbag(6, -2); makeSandbag(-6, 3); makeSandbag(6, 3);

// ---- Chandelier (droppable) ----
// Hangs over the stage at (0, 7, -2). A rope runs from it down to a cleat
// on the stage floor (3, 0.9, -5) — slash near the cleat to cut the rope
// and drop the chandelier on whoever is underneath.
const chandelier = { x: 0, z: -2, y: 7, dropped: false, falling: false, vy: 0, used: false, group: new THREE.Group() };
{
  const g = chandelier.group;
  const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 3, 8), new THREE.MeshStandardMaterial({ color: 0x8a6b3a }));
  chain.position.set(0, 1.5, 0); g.add(chain);
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 1.2, 12), new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.6, roughness: 0.4 }));
  col.position.set(0, 0, 0); g.add(col);
  // A clean ring chandelier: a full gold ring at the arm ends, 8 straight
  // radial arms from the central column out to the ring, a candle cup +
  // candle + flame on each arm end, and crystal drops hanging below.
  // (The old build used 8 quarter-torus arms with tangled rotations and
  // read as a yellow scribble of candles.)
  const gold = new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.6, roughness: 0.4 });
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.04, 8, 32), gold);
  ring.rotation.x = Math.PI / 2; ring.position.set(0, -0.15, 0); g.add(ring);
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    const dir = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.55, 8), gold);
    arm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    arm.position.set(dir.x * 0.425, -0.15, dir.z * 0.425); g.add(arm);
    const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.05, 10), gold);
    cup.position.set(dir.x * 0.7, -0.12, dir.z * 0.7); g.add(cup);
    const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.22, 8), new THREE.MeshStandardMaterial({ color: 0xfff2cc, emissive: 0xffc94d, emissiveIntensity: 1.0 }));
    candle.position.set(dir.x * 0.7, 0.02, dir.z * 0.7); g.add(candle);
    const flame = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.09, 8), new THREE.MeshStandardMaterial({ color: 0xffcc33, emissive: 0xffaa00, emissiveIntensity: 2.0 }));
    flame.position.set(dir.x * 0.7, 0.17, dir.z * 0.7); g.add(flame);
    const drop = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }));
    drop.position.set(dir.x * 0.7, -0.45, dir.z * 0.7); g.add(drop);
  }
  const finial = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.6, roughness: 0.4 }));
  finial.position.set(0, -0.7, 0); g.add(finial);
  g.position.set(chandelier.x, chandelier.y, chandelier.z); scene.add(g);
  const chLight = new THREE.PointLight(0xffc94d, 25, 15); chLight.position.set(0, -0.3, 0); g.add(chLight);
  // The drop rope: from the chandelier down to a cleat at the stage edge.
  const ropeLen = Math.hypot(3 - 0, 5 - 2, 7 - STAGE_TOP);
  const dropRope = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, ropeLen, 8), new THREE.MeshStandardMaterial({ color: 0x8a6b3a }));
  dropRope.position.set(1.5, (7 + STAGE_TOP) / 2, -3.5);
  dropRope.rotation.z = Math.atan2(3 - 0, 7 - STAGE_TOP); dropRope.rotation.x = -Math.atan2(-5 - -2, 7 - STAGE_TOP);
  scene.add(dropRope); chandelier.rope = dropRope;
  chandelier.cleat = { x: 3, z: -5 };
  colliders.push({ x: 3, z: -5, r: 0.5 });
}

// ---- Set flats (topple-able painted backdrops) ----
// set_flat.glb (painted garden panel, 0.60 x 1.00 m; scale 5.0 -> ~3.0 x
// 5.0 m, so they read as large stage flats, not door-sized panels).
// Uniform scale, so the painted garden scene does not stretch. Origin is
// centred, so the model is raised by half its scaled height to sit on
// the stage floor. The outer group carries the facing (rotation.y); the

addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if ((e.key === ' ' || e.key.toLowerCase() === 'f') && started) { e.preventDefault(); trySlash(); }
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
addEventListener('mousemove', (e) => {
  if (document.pointerLockElement && started && !cine) { yaw -= e.movementX * 0.003; pitch = Math.max(-0.4, Math.min(0.5, pitch - e.movementY * 0.003)); }
});
renderer.domElement.addEventListener('mousedown', (e) => {
  if (document.pointerLockElement && started && !cine && !won) trySlash();
});
let joyId = null, joyX = 0, joyY = 0, lookId = null, lastLX = 0, lastLY = 0;
const joy = document.getElementById('joy'), knob = document.getElementById('knob');
joy.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; joyId = t.identifier; moveJoy(t); e.preventDefault(); }, { passive: false });
joy.addEventListener('touchmove', (e) => { for (const t of e.changedTouches) if (t.identifier === joyId) moveJoy(t); e.preventDefault(); }, { passive: false });
function endJoy(e) { for (const t of e.changedTouches) if (t.identifier === joyId) { joyId = null; joyX = joyY = 0; knob.style.left = '37px'; knob.style.top = '37px'; } }
joy.addEventListener('touchend', endJoy); joy.addEventListener('touchcancel', endJoy);
function moveJoy(t) {
  const r = joy.getBoundingClientRect(); const dx = (t.clientX - (r.left + 65)) / 50, dy = (t.clientY - (r.top + 65)) / 50;
  const m = Math.min(1, Math.hypot(dx, dy)) || 1; joyX = dx / Math.max(1, Math.hypot(dx, dy)) * m; joyY = dy / Math.max(1, Math.hypot(dx, dy)) * m;
  knob.style.left = (37 + joyX * 35) + 'px'; knob.style.top = (37 + joyY * 35) + 'px';
}
renderer.domElement.addEventListener('touchstart', (e) => {
  if (!started) return;
  for (const t of e.changedTouches) { if (t.identifier !== joyId) { lookId = t.identifier; lastLX = t.clientX; lastLY = t.clientY; } }
}, { passive: true });
renderer.domElement.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) if (t.identifier === lookId) {
    yaw -= (t.clientX - lastLX) * 0.005; pitch = Math.max(-0.4, Math.min(0.5, pitch - (t.clientY - lastLY) * 0.005));
    lastLX = t.clientX; lastLY = t.clientY;
  }
}, { passive: true });
renderer.domElement.addEventListener('touchend', (e) => { for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null; });
document.getElementById('slashBtn').addEventListener('touchstart', (e) => { e.preventDefault(); trySlash(); }, { passive: false });

// ---- Loop ----
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); const t = clock.elapsedTime;
  if (slashCooldown > 0) slashCooldown -= dt;
  if (slashTimer > 0) slashTimer -= dt;
  updateCinematic(dt);
  if (bowPhase) updateBow(dt);
  updateEnemies(dt, t);
  updateDestructibles(dt);
  if (started && !won && !cine && !bowPhase) {
    let fx = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
    let fz = (keys['w'] ? 1 : 0) - (keys['s'] ? 1 : 0);
    if (joyId !== null) { fx += joyX; fz += -joyY; }
    const ml = Math.hypot(fx, fz);
    if (ml > 1) { fx /= ml; fz /= ml; }
    const dx = fx * Math.cos(yaw) - fz * Math.sin(yaw);
    const dz = -fx * Math.sin(yaw) - fz * Math.cos(yaw);
    const speed = (keys['shift'] ? 5.5 : 4) * dt;
    const nx = player.position.x + dx * speed, nz = player.position.z + dz * speed;
    // The stage front face is a wall except at the centre steps: a move
    // that changes ground height by more than 0.45 m is blocked.
    const curG = groundHeight(player.position.x, player.position.z);
    const newG = groundHeight(nx, nz);
    if (Math.abs(newG - curG) <= 0.45) {
      player.position.x = nx; player.position.z = nz;
      player.position.y = newG;
    }
    player.position.x = Math.max(-13.5, Math.min(13.5, player.position.x));
    player.position.z = Math.max(-9.5, Math.min(29.5, player.position.z));
    player.position.y = groundHeight(player.position.x, player.position.z);
    for (const c of colliders) {
      const ddx = player.position.x - c.x, ddz = player.position.z - c.z, d = Math.hypot(ddx, ddz);
      if (d < c.r && d > 0.01) { player.position.x = c.x + ddx / d * c.r; player.position.z = c.z + ddz / d * c.r; }
    }
    player.rotation.y = yaw;
    if (mixer) {
      mixer.update(dt);
      if (slashTimer <= 0) playClip(ml > 0.1 ? 'walk' : 'idle');
    }
    if (defeated >= 8 && !bowPhase && !won) startBow();
  } else if (mixer && (cine || bowPhase)) {
    mixer.update(dt);
  }
  if (!cine) {
    const back = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
    camera.position.set(player.position.x + back.x * 5, player.position.y + 2.6, player.position.z + back.z * 5);
    camera.lookAt(player.position.x - back.x * 3, player.position.y + 1.6, player.position.z - back.z * 3);
  } else {
    camera.position.set(0, 2.5, 16);
    camera.lookAt(0, 2, 0);
  }
  renderer.render(scene, camera);
}
updateEnemyCount();
if (new URLSearchParams(location.search).has('test')) {
  window.__theater = {
    player, enemies, sandbags, chandelier, setFlats, drapeState, crates,
    footlightsState, spotL, spotR,
    get defeated() { return defeated; }, get won() { return won; },
    get cine() { return cine; }, get bowPhase() { return bowPhase; },
    startCinematic, trySlash, defeatEnemy, spawnNextEnemy, startBow, groundHeight,
  };
}
animate();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
